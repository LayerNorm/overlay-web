# Read mirror sidecar — overlay file, layered on top of docker-compose.convex.yml:
#
#   docker compose \
#     -f docker-compose.convex.yml -f docker-compose.mirror.yml \
#     --env-file convex.env --env-file .env.convex.local \
#     up -d mirror
#
# Replicates the self-hosted Convex deployment into normalized Postgres
# tables ({MIRROR_SCHEMA}.<table>) for BI / data-lake queries. The mirror
# database defaults to a dedicated `mirror` DB on the bundled postgres —
# point MIRROR_DATABASE_URL at a managed instance for real deployments.
services:
  mirror:
    build: ./mirror
    restart: unless-stopped
    environment:
      # In-cluster address; the export API lives on the backend's client port.
      CONVEX_URL: http://backend:3210
      # Admin key generated by bin/convex-bootstrap.sh — supplied via
      # .env.convex.local (CONVEX_SELF_HOSTED_ADMIN_KEY) or set CONVEX_ADMIN_KEY.
      CONVEX_ADMIN_KEY: ${CONVEX_ADMIN_KEY:-}
      CONVEX_SELF_HOSTED_ADMIN_KEY: ${CONVEX_SELF_HOSTED_ADMIN_KEY:-}
      MIRROR_DATABASE_URL: postgres://${POSTGRES_USER:-convex}:${POSTGRES_PASSWORD}@postgres:5432/${MIRROR_DB:-mirror}
      # Used once at startup to CREATE DATABASE ${MIRROR_DB:-mirror} if absent.
      # Unset to skip auto-creation (e.g. managed Postgres without superuser).
      MIRROR_ADMIN_URL: ${MIRROR_ADMIN_URL:-postgres://${POSTGRES_USER:-convex}:${POSTGRES_PASSWORD}@postgres:5432/postgres}
      MIRROR_SCHEMA: ${MIRROR_SCHEMA:-mirror}
      MIRROR_POLL_MS: ${MIRROR_POLL_MS:-2000}
      # Optional: comma-separated Convex table allowlist, e.g. "users,threads"
      MIRROR_TABLES: ${MIRROR_TABLES:-}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
