title = "Overlay gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Documented S3 placeholder values used in public examples"
regexes = [
  '''replace_with_s3_secret(?:_key)?''',
  '''s3_secret_key_placeholder''',
  '''S3-compatible''',
]

[[allowlists]]
description = "Sentry sanitizer tests intentionally contain fake secrets to verify redaction"
paths = [
  '''src/shared/security/sentry-sanitize\.test\.ts$''',
]

[[allowlists]]
description = "Agent profile tests intentionally contain fake secrets to verify detection and redaction"
paths = [
  '''packages/overlay-agent-bridge-protocol/src/agent-profile\.test\.ts$''',
  '''src/server/agents/profiles/AgentProfileService\.test\.ts$''',
]

[[allowlists]]
description = "Generated mockup bundles: minified production code built by internal/plans/mockups/overlay-app/build.mjs"
paths = [
  '''internal/plans/mockups/(overlay-app|local-cloud-continuity|files-on-computers|thread-folders)\.html$''',
]

[[allowlists]]
description = "Minified mockup bundle: a font-atlas counter (`keyCount,m=d.atlasCount`) reads as key=value to generic-api-key"
regexTarget = "match"
regexes = [
  '''keyCount,[A-Za-z_$][A-Za-z0-9_$]{0,2}=[A-Za-z_$][A-Za-z0-9_$]{0,2}\.atlasCount''',
]

[[allowlists]]
description = "Build output directories are not source files"
paths = [
  '''\.next/.*''',
  '''dist/.*''',
  '''build/.*''',
  '''coverage/.*''',
]

[[allowlists]]
description = "Minified variable names in the generated app mockup bundle look like key assignments"
condition = "AND"
paths = [
  '''internal/plans/mockups/overlay-app\.html$''',
]
regexes = [
  '''keyCount,[A-Za-z_$][\w$]{0,2}=''',
]

[[allowlists]]
description = "Environment example files contain placeholder secrets for documentation"
paths = [
  '''\.env\.example$''',
  '''deploy/ec2/\.env\.example$''',
  '''\.env\.local\.example$''',
]
regexes = [
  '''replace_me_with_64_hex_characters''',
  '''YOUR_[A-Z_]+''',
  '''placeholder''',
]
