name: overlay-ec2-sanity

x-overlay-runtime: &overlay-runtime
  image: ${OVERLAY_WEB_IMAGE:-ghcr.io/layernorm/overlay-web:0.1.0-rc.1}
  env_file:
    - ${OVERLAY_ENV_FILE:-.env}
  environment:
    HOSTNAME: 0.0.0.0
    NODE_ENV: production
    OVERLAY_CONFIG_FILE: /app/overlay.config.json
    PORT: 3000
  volumes:
    - ${OVERLAY_CONFIG_PATH:-./overlay.config.json}:/app/overlay.config.json:ro
  init: true
  stop_grace_period: 30s

services:
  web:
    <<: *overlay-runtime
    command: ["node", "server.js"]
    # Host networking lets one baked URL (http://127.0.0.1:3210) serve both the
    # browser (via the SSH tunnel) and the in-container server client (via the
    # host-published backend port). NEXT_PUBLIC_* is inlined at image build;
    # for source builds pass --build-arg NEXT_PUBLIC_CONVEX_URL.
    network_mode: host
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/capabilities').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  backend:
    image: ${CONVEX_BACKEND_IMAGE:-ghcr.io/get-convex/convex-backend:latest}
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      # Client API + realtime sync on the host loopback; the operator reaches it
      # through the same SSH tunnel as the web app.
      - "127.0.0.1:${CONVEX_API_PORT:-3210}:3210"
      - "127.0.0.1:${CONVEX_SITE_PORT:-3211}:3211"
    volumes:
      - convex-data:/convex/data
    environment:
      # Local-volume persistence for the sanity check. For qualified
      # deployments use POSTGRES_URL + S3 per the self-hosted Convex runbook.
      INSTANCE_NAME: ${INSTANCE_NAME:-overlay-ec2-sanity}
      INSTANCE_SECRET: ${INSTANCE_SECRET:?set in .env}
      CONVEX_CLOUD_ORIGIN: ${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:3210}
      CONVEX_SITE_ORIGIN: ${CONVEX_SITE_ORIGIN:-http://127.0.0.1:3211}
      DISABLE_BEACON: "true"
      RUST_LOG: ${RUST_LOG:-info}
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 20s
    restart: unless-stopped

  migrate:
    <<: *overlay-runtime
    command:
      - sh
      - -lc
      - >-
        NODE_OPTIONS=--conditions=react-server node_modules/.bin/tsx scripts/db/better-auth-migrate.ts
    profiles: ["tools"]
    restart: "no"

volumes:
  convex-data:
