name: CI dependencies
description: Set up the pinned Node.js and Bun, then install the monorepo from bun.lock with Bun's download cache restored.
inputs:
  node-version:
    description: Node.js major version
    required: true
  lifecycle-scripts:
    description: "'true' runs install scripts of the workspaces and trusted dependencies (the desktop app needs them)"
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    # Exact patch versions keep the cache key stable across runner images. Bump
    # both together.
    - name: Resolve pinned Node.js version
      id: pinned
      shell: bash
      env:
        MAJOR: ${{ inputs.node-version }}
      run: |
        case "$MAJOR" in
          22) echo "version=22.23.5" >> "$GITHUB_OUTPUT" ;;
          24) echo "version=24.22.3" >> "$GITHUB_OUTPUT" ;;
          *) echo "::error::No pinned Node.js patch for major '$MAJOR'"; exit 1 ;;
        esac
    - name: Set up Node.js
      id: node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.pinned.outputs.version }}
        package-manager-cache: false
    # The repository's package manager; its version comes from packageManager in package.json.
    - name: Set up Bun
      id: bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: package.json
    # Bun installs by linking from its download cache, so caching downloads
    # (not node_modules) keeps a warm install to seconds.
    - name: Restore Bun download cache
      id: dependencies
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.bun/install/cache
        key: bun-cache-v1-${{ runner.os }}-${{ runner.arch }}-bun${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
        restore-keys: |
          bun-cache-v1-${{ runner.os }}-${{ runner.arch }}-bun${{ steps.bun.outputs.bun-version }}-
    # --frozen-lockfile fails when package.json and bun.lock disagree.
    - name: Install from lockfile
      shell: bash
      env:
        LIFECYCLE_SCRIPTS: ${{ inputs.lifecycle-scripts }}
      run: |
        if [ "$LIFECYCLE_SCRIPTS" = true ]; then bun install --frozen-lockfile
        else bun install --frozen-lockfile --ignore-scripts; fi
    # Merge-queue refs are deleted after merging, so their saves only evict main's.
    - name: Save Bun download cache
      if: steps.dependencies.outputs.cache-hit != 'true' && github.event_name != 'merge_group'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.bun/install/cache
        key: ${{ steps.dependencies.outputs.cache-primary-key }}
    - name: Report dependency cache result
      shell: bash
      run: echo "::notice title=CI dependency cache::${{ steps.dependencies.outputs.cache-hit == 'true' && 'hit' || 'miss' }}"
