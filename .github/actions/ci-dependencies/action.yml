name: CI dependencies
description: Restore an exact installed dependency tree from the Actions cache, or install it from the lockfile.
inputs:
  node-version:
    description: Node.js major version
    required: true
runs:
  using: composite
  steps:
    # Exact patch versions keep the dependency cache key stable. A floating major
    # resolved to different patches on different runner images, so PRs missed
    # main's cache and wrote ~800 MB copies that evicted it. Bump both together.
    - name: Resolve pinned Node.js version
      id: pinned
      shell: bash
      env:
        MAJOR: ${{ inputs.node-version }}
      run: |
        case "$MAJOR" in
          22) echo "version=22.23.5" >> "$GITHUB_OUTPUT" ;;
          24) echo "version=24.22.3" >> "$GITHUB_OUTPUT" ;;
          *) echo "::error::No pinned Node.js patch for major '$MAJOR'"; exit 1 ;;
        esac
    - name: Set up Node.js
      id: node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.pinned.outputs.version }}
        package-manager-cache: false
    - name: Pin npm
      shell: bash
      run: npm install -g npm@11.11.0 --no-audit --no-fund
    - name: Restore installed dependencies
      id: dependencies
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          node_modules
          packages/*/node_modules
          apps/*/node_modules
        key: ci-dependencies-v2-${{ runner.os }}-${{ runner.arch }}-node${{ inputs.node-version }}-${{ steps.node.outputs.node-version }}-npm11.11.0-${{ hashFiles('package-lock.json', 'package.json', 'packages/*/package.json', 'apps/*/package.json', '.npmrc', '.github/actions/ci-dependencies/action.yml') }}
    - name: Install from lockfile
      if: steps.dependencies.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --ignore-scripts --no-audit --no-fund
    # Merge-queue refs are deleted after merging, so their saves only evict main's.
    - name: Save installed dependencies
      if: steps.dependencies.outputs.cache-hit != 'true' && github.event_name != 'merge_group'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          node_modules
          packages/*/node_modules
          apps/*/node_modules
        key: ${{ steps.dependencies.outputs.cache-primary-key }}
    - name: Report dependency cache result
      shell: bash
      run: echo "::notice title=CI dependency cache::${{ steps.dependencies.outputs.cache-hit == 'true' && 'hit' || 'miss' }}"
