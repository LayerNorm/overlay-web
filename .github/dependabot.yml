version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    groups:
      codeql-actions:
        patterns:
          - "github/codeql-action*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # No upstream patch. Dev-only transitive from @puppeteer/browsers.
      - dependency-name: extract-zip
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
