name: Feature request
description: Propose a focused product or platform improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should Overlay solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior and how success would be verified.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: surface
    attributes:
      label: Primary surface
      options:
        - Web app
        - API or SDK
        - Convex or data layer
        - Desktop
        - Mobile
        - Browser extension
        - Documentation
        - Other
