name: BYO Agent Host compatibility

on:
  pull_request:
    paths:
      - 'packages/overlay-agent-bridge-protocol/**'
      - 'packages/overlay-agent-host/**'
      - '.github/workflows/byo-agent-host.yml'
      - '.github/workflows/publish-agent-host.yml'
  push:
    branches: [main]
    paths:
      - 'packages/overlay-agent-bridge-protocol/**'
      - 'packages/overlay-agent-host/**'
      - '.github/workflows/byo-agent-host.yml'
      - '.github/workflows/publish-agent-host.yml'
  workflow_dispatch:
    inputs:
      candidate_artifacts:
        description: Pack the unpublished host/protocol for isolated desktop acceptance
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  host:
    name: Agent Host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:agent-bridge-protocol
      - run: npm --prefix packages/overlay-agent-bridge-protocol run typecheck
      - run: npm run test:agent-host
      - run: npm --prefix packages/overlay-agent-host run typecheck
      - if: runner.os == 'Linux'
        run: npm run verify:agent-host-release
      - if: runner.os == 'Linux'
        run: npm run pack:agent-host-release
      - name: Pack isolated acceptance candidate
        if: runner.os == 'Linux' && inputs.candidate_artifacts == true
        run: |
          npm run smoke:agent-host-release
          mkdir -p artifacts/agent-host-candidate
          npm pack --workspace=@layernorm/overlay-agent-bridge-protocol --pack-destination artifacts/agent-host-candidate
          npm pack --workspace=@layernorm/overlay-agent-host --pack-destination artifacts/agent-host-candidate
          node -e 'require("node:fs").writeFileSync("artifacts/agent-host-candidate/provenance.json", JSON.stringify({sourceSha:process.env.GITHUB_SHA}))'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: runner.os == 'Linux' && inputs.candidate_artifacts == true
        with:
          name: agent-host-candidate
          path: artifacts/agent-host-candidate/
          if-no-files-found: error
          retention-days: 3
