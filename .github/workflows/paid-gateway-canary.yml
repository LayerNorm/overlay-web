name: Paid Gateway Canary

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      run_paid_gateway_canary:
        description: Run the paid gateway canary with a default $0.01 preflight cap
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  paid-gateway-canary:
    name: Paid Gateway Canary
    if: >-
      (github.event_name == 'deployment_status' &&
        github.event.deployment_status.state == 'success' &&
        contains(github.event.deployment.environment, 'Production') &&
        contains(github.event.deployment.environment, 'overlay-landing')) ||
      (github.event_name == 'workflow_dispatch' && inputs.run_paid_gateway_canary)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v4
        with:
          persist-credentials: false
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check Gateway secret
        id: gateway-secret
        shell: bash
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          if [ -n "$AI_GATEWAY_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "AI_GATEWAY_API_KEY secret is not configured; skipping paid canary."
          fi

      - name: Run paid Gateway canary
        if: steps.gateway-secret.outputs.present == 'true'
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AI_GATEWAY_CANARY_CONFIRM_SPEND: '1'
          AI_GATEWAY_CANARY_MAX_COST_USD: '0.01'
          AI_GATEWAY_CANARY_MODEL: 'google/gemini-3-flash'
          AI_GATEWAY_CANARY_INPUT_TOKEN_BUDGET: '512'
          AI_GATEWAY_CANARY_OUTPUT_TOKEN_BUDGET: '8'
        run: npm run test:gateway-canary
