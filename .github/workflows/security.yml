name: Security Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base_url}/${asset}"
          curl -fsSLO "${base_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "  ${asset}$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${asset}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks
        run: gitleaks detect --source . --no-git --redact --verbose

  public-env-guard:
    name: Guard Public Env Names
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v4
        with:
          persist-credentials: false

      - name: Fail on public secret-like env vars
        shell: bash
        run: |
          set -euo pipefail
          allowlist='NEXT_PUBLIC_(SENTRY_DSN|CONVEX_URL|APP_URL|POSTHOG_TOKEN|POSTHOG_HOST)'
          matches="$(
            {
              git grep -nE 'NEXT_PUBLIC_[A-Z0-9_]*(SECRET|TOKEN|KEY|PASSWORD)' -- \
                . \
                ':(exclude).env.example' \
                ':(exclude)README.md' \
                ':(exclude)ENV_SETUP.md' \
                ':(exclude)TESTING_CHECKLIST.md' \
                ':(exclude)docs/**' \
                || true
            } | grep -vE "$allowlist" \
              || true
          )"

          if [ -n "$matches" ]; then
            echo "Forbidden public env variable names found:"
            echo "$matches"
            exit 1
          fi

          echo "No forbidden NEXT_PUBLIC_* secret-like variables found."

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
      security-events: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v4
        with:
          persist-credentials: false

      - name: Detect dependency graph availability
        id: dependency-graph
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # actions/github-script v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.repos.get({
              owner,
              repo,
            });
            const status = response.data.security_and_analysis?.dependency_graph?.status || 'disabled';
            core.setOutput('enabled', String(status === 'enabled'));

      - name: Check dependency changes
        if: steps.dependency-graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # actions/dependency-review-action v5.0.0

      - name: Skip dependency review when dependency graph is disabled
        if: steps.dependency-graph.outputs.enabled != 'true'
        run: echo "Skipping dependency review because GitHub dependency graph is disabled for this repository."

  dependency-audit:
    name: Required Quality and Security Gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v4
        with:
          persist-credentials: false

      - name: Check out desktop transcript contract
        run: git submodule update --init --depth 1 overlay-desktop

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm install -g npm@11.11.0

      - name: Ensure package lock exists
        run: test -f package-lock.json

      - name: Install from lockfile
        run: npm ci --ignore-scripts

      - name: Verify lockfile is in sync
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code package-lock.json package.json

      - name: Lint
        run: npm run lint

      - name: Web complexity ratchet
        run: npm run check:web-complexity

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          INTERNAL_API_SECRET: test-internal-secret
          NEXT_PUBLIC_CONVEX_URL: https://fixture.convex.cloud
          OVERLAY_DEPLOYMENT_ENV: test
        run: npm run build

      - name: Verify core route contracts
        run: npm run test:route-characterization

      - name: Verify migration and endpoint safety rails
        run: npm run check:config && npm run test:release-safety

      - name: Verify tenant boundary guard
        run: npm run check:tenant-boundaries

      - name: Verify on-prem parity matrix
        run: npm run check:on-prem-parity

      - name: Verify public documentation health
        run: npm run docs:health

      - name: Audit production dependencies
        run: npm run security:audit
