name: Security Checks

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base_url}/${asset}"
          curl -fsSLO "${base_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "  ${asset}$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${asset}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks
        run: gitleaks detect --source . --no-git --redact --verbose

  public-env-guard:
    name: Guard Public Env Names
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v4
        with:
          persist-credentials: false

      - name: Fail on public secret-like env vars
        shell: bash
        run: |
          set -euo pipefail
          allowlist='NEXT_PUBLIC_(SENTRY_DSN|CONVEX_URL|APP_URL|POSTHOG_TOKEN|POSTHOG_HOST)'
          matches="$(
            {
              git grep -nE 'NEXT_PUBLIC_[A-Z0-9_]*(SECRET|TOKEN|KEY|PASSWORD)' -- \
                . \
                ':(exclude).env.example' \
                ':(exclude)README.md' \
                ':(exclude)ENV_SETUP.md' \
                ':(exclude)TESTING_CHECKLIST.md' \
                ':(exclude)docs/**' \
                || true
            } | grep -vE "$allowlist" \
              || true
          )"

          if [ -n "$matches" ]; then
            echo "Forbidden public env variable names found:"
            echo "$matches"
            exit 1
          fi

          echo "No forbidden NEXT_PUBLIC_* secret-like variables found."

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      contents: read
      pull-requests: read
      security-events: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v4
        with:
          persist-credentials: false

      - name: Check dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # actions/dependency-review-action v5.0.0
        with:
          base-ref: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha }}

  static:
    name: Lint, types and boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INTERNAL_API_SECRET: test-internal-secret
      NEXT_PUBLIC_CONVEX_URL: https://fixture.convex.cloud
      OVERLAY_DEPLOYMENT_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v4
        with:
          persist-credentials: false

      - name: Check out desktop transcript contract
        run: git submodule update --init --depth 1 overlay-desktop

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm install -g npm@11.11.0

      - name: Install from lockfile
        run: npm ci --ignore-scripts

      - name: Verify lockfile is in sync
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code package-lock.json package.json
      - name: Lint
        run: npm run lint
      - name: Raw interactive control guardrail
        run: npm run check:raw-controls
      - name: Removed chat renderer guard
        run: npm run check:chat-legacy-imports
      - name: Web complexity ratchet
        run: npm run check:web-complexity
      - name: Generate current route types
        run: npx next typegen
      - name: Typecheck and boundary contracts
        run: npm run typecheck
      - name: Audit production dependencies
        run: npm run security:audit

  build:
    name: Production compilation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INTERNAL_API_SECRET: test-internal-secret
      NEXT_PUBLIC_CONVEX_URL: https://fixture.convex.cloud
      OVERLAY_DEPLOYMENT_ENV: test
      # The independently required static lane checks freshly generated types.
      OVERLAY_SKIP_BUILD_TYPECHECK: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v4
        with:
          persist-credentials: false

      - name: Check out desktop transcript contract
        run: git submodule update --init --depth 1 overlay-desktop

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: npm install -g npm@11.11.0

      - name: Install from lockfile
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build
      # Keep this after build: Workflow generates routes checked by this guard.
      - name: Verify configuration and migration safety
        run: npm run check:config && npm run test:release-safety
      - name: Verify tenant boundary guard
        run: npm run check:tenant-boundaries
      - name: Verify admin console separation
        run: npm run check:admin-separation
      - name: Verify on-prem Convex boundaries
        run: npm run check:on-prem-convex-boundaries

  tests:
    name: Full suite (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v4
        with:
          persist-credentials: false

      - name: Check out desktop transcript contract
        run: git submodule update --init --depth 1 overlay-desktop

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: npm install -g npm@11.11.0

      - name: Install from lockfile
        run: npm ci --ignore-scripts

      - name: Verify complete shard partition
        run: node scripts/ci/run-all-tests.mjs --verify-shards 2
      - name: Run full suite shard
        run: node scripts/ci/run-all-tests.mjs --shard ${{ matrix.shard }}/2

  contracts:
    name: Schema and Routing Contracts
    if: ${{ always() }}
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Require successful contract execution
        env:
          TEST_RESULT: ${{ needs.tests.result }}
        run: test "$TEST_RESULT" = success

  admin-console:
    uses: ./.github/workflows/admin.yml

  dependency-audit:
    name: Required Quality and Security Gates
    if: ${{ always() }}
    needs: [static, build, tests, secret-scan, public-env-guard, dependency-review, admin-console]
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality lane
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          node - <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const expected = ['static', 'build', 'tests', 'secret-scan', 'public-env-guard', 'dependency-review', 'admin-console'];
          if (Object.keys(needs).sort().join() !== [...expected].sort().join()) process.exit(1);
          for (const name of expected) {
            const allowed = name === 'dependency-review' &&
              !['pull_request', 'merge_group'].includes(process.env.EVENT_NAME) ? 'skipped' : 'success';
            if (needs[name].result !== allowed) {
              console.error(`${name}: expected ${allowed}, received ${needs[name].result}`);
              process.exitCode = 1;
            }
          }
          NODE
