name: Admin Console

on:
  workflow_call:

permissions:
  contents: read

jobs:
  admin-console:
    name: Admin Console Checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v4
        with:
          persist-credentials: false

      - name: Install the workspace
        uses: ./.github/actions/ci-dependencies
        with:
          node-version: 24

      - name: Typecheck
        run: bun run admin:typecheck

      - name: Lint
        run: bun run admin:lint

      - name: Build
        run: bun run admin:build
