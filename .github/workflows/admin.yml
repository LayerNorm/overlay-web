name: Admin Console

on:
  workflow_call:

permissions:
  contents: read

jobs:
  admin-console:
    name: Admin Console Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # actions/setup-node v4
        with:
          cache: npm
          node-version: 24

      - name: Install dependencies
        run: npm ci --workspace=@overlay/admin --include-workspace-root=false

      - name: Typecheck
        run: npm run admin:typecheck

      - name: Lint
        run: npm run admin:lint

      - name: Build
        run: npm run admin:build
