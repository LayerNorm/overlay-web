name: Admin Console

on:
  workflow_call:

permissions:
  contents: read

jobs:
  admin-console:
    name: Admin Console Checks
    runs-on:
      - nscloud-ubuntu-24.04-amd64-4x8-with-features-with-builders;job.priority=${{ (github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && 2 || github.actor == 'dependabot[bot]' && 6 || 4 }}
      - nscloud-no-remote-builders
      - namespace-features:github.run-id=${{ github.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node v4
        with:
          cache: npm
          node-version: 24

      - name: Install dependencies
        run: npm ci --workspace=@overlay/admin --include-workspace-root=false

      - name: Typecheck
        run: npm run admin:typecheck

      - name: Lint
        run: npm run admin:lint

      - name: Build
        run: npm run admin:build
