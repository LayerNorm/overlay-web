name: Gateway Contracts

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/gateway-contracts.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/qa/vercel-ai-gateway-canary.ts'
      - 'src/server/ai/gateway/**'
      - 'src/server/app-api/v1/conversations/act/**'
      - 'src/server/tools/**'
      - 'src/shared/security/safe-log.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Schema and Routing Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Gateway contracts
        run: npm run test:gateway-contracts
