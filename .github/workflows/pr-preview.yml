name: PR Preview

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Internal PR to reconcile (needs-preview label required to deploy)
        required: true
        type: string
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  inventory:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    runs-on:
      - nscloud-ubuntu-24.04-amd64-2x4-with-features-with-builders;job.priority=${{ (github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && 2 || github.actor == 'dependabot[bot]' && 6 || 4 }}
      - nscloud-no-remote-builders
      - namespace-features:github.run-id=${{ github.run_id }}
    environment: release-control
    outputs:
      numbers: ${{ steps.inventory.outputs.numbers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - id: inventory
        run: node scripts/release/preview-control.mjs inventory
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_PREVIEW_TOKEN: ${{ secrets.VERCEL_PREVIEW_TOKEN }}
          CONVEX_PREVIEW_CONTROL_KEY: ${{ secrets.CONVEX_PREVIEW_CONTROL_KEY }}

  preview:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on:
      - nscloud-ubuntu-24.04-amd64-2x4-with-features-with-builders;job.priority=${{ (github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && 2 || github.actor == 'dependabot[bot]' && 6 || 4 }}
      - nscloud-no-remote-builders
      - namespace-features:github.run-id=${{ github.run_id }}
    environment: release-control
    timeout-minutes: 40
    concurrency:
      group: pr-preview-${{ inputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      statuses: write
    steps:
      # Always execute protected main, never the PR head or its package scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - run: node scripts/release/preview-control.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_PREVIEW_TOKEN: ${{ secrets.VERCEL_PREVIEW_TOKEN }}
          CONVEX_PREVIEW_CONTROL_KEY: ${{ secrets.CONVEX_PREVIEW_CONTROL_KEY }}

  reconcile:
    needs: inventory
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && needs.inventory.outputs.numbers != '[]'
    runs-on:
      - nscloud-ubuntu-24.04-amd64-2x4-with-features-with-builders;job.priority=${{ (github.ref == 'refs/heads/main' || github.event_name == 'merge_group') && 2 || github.actor == 'dependabot[bot]' && 6 || 4 }}
      - nscloud-no-remote-builders
      - namespace-features:github.run-id=${{ github.run_id }}
    environment: release-control
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pr: ${{ fromJSON(needs.inventory.outputs.numbers) }}
    concurrency:
      group: pr-preview-${{ matrix.pr }}
      cancel-in-progress: false
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - run: node scripts/release/preview-control.mjs "$PREVIEW_PR_NUMBER"
        env:
          PREVIEW_PR_NUMBER: ${{ matrix.pr }}
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_PREVIEW_TOKEN: ${{ secrets.VERCEL_PREVIEW_TOKEN }}
          CONVEX_PREVIEW_CONTROL_KEY: ${{ secrets.CONVEX_PREVIEW_CONTROL_KEY }}
