name: Desktop app

# Checks apps/desktop from a clean checkout on macOS. Runs only when the desktop
# app, the shared desktop bridge contract or this workflow changes.
on:
  workflow_dispatch:
    inputs:
      local_transcription:
        description: Run the pinned local-model transcription smoke
        type: boolean
        default: false
  pull_request:
    paths:
      - apps/desktop/**
      - packages/overlay-desktop-bridge/**
      - scripts/ci/desktop-web-shell-boundary*.mjs
      - .github/workflows/desktop.yml
  push:
    branches:
      - main
    paths:
      - apps/desktop/**
      - packages/overlay-desktop-bridge/**
      - scripts/ci/desktop-web-shell-boundary*.mjs
      - .github/workflows/desktop.yml

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/desktop

jobs:
  verify:
    name: Desktop lint, test, build and package
    # Actual Core ML acceptance uses the current macOS generation. Keep the
    # ordinary compilation/interaction lane on the older supported image.
    runs-on: ${{ inputs.local_transcription == true && 'macos-26' || 'macos-15' }}
    timeout-minutes: 45

    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Generated mockup pages are never part of the desktop app.
          sparse-checkout: |
            /*
            !/internal/plans/**/*.html
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install from the desktop lockfile
        run: npm ci

      - name: Verify public source boundaries
        run: |
          npm run license:check
          # Gate on production dependencies only. Dev-tool advisories (eslint,
          # electron-builder toolchain) do not ship in the macOS app artifact.
          npm run check:dependencies:prod
          npm run check:release-security
          npm run check:public-source-secrets

      - name: Test and compile
        run: |
          npm run lint
          npm test
          npm run build

      - name: Exercise the sandboxed Electron bridge
        run: npx playwright test e2e/bridge.e2e.ts e2e/migration.e2e.ts e2e/recorder.e2e.ts

      - name: Transcribe synthetic speech with a pinned local model
        if: ${{ inputs.local_transcription == true }}
        run: npx playwright test e2e/transcription.e2e.ts

      - name: Package an unsigned Apple Silicon app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run build:agent-host
          npx electron-builder --mac --arm64 --dir --publish never
          test -x dist/mac-arm64/Overlay.app/Contents/Resources/agent-host/node

      - name: Record compiled-source provenance
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node -e 'require("node:fs").writeFileSync("out/provenance.json", JSON.stringify({ builtSha: process.env.GITHUB_SHA, headSha: process.env.PR_HEAD_SHA }))'

      - name: Save compiled shell for interactive QA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-web-shell-build
          path: apps/desktop/out/
          retention-days: 7
          if-no-files-found: error

      - name: Save desktop interaction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-interaction-evidence
          path: apps/desktop/test-results/
          retention-days: 7
          if-no-files-found: ignore
