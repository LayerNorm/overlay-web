name: Chrome extension

# Checks apps/chrome, the side panel that frames the web app, and the bridge
# contract it shares with the web app (packages/overlay-chrome-bridge). The
# extension is a workspace of the root Bun install and imports nothing else.
on:
  pull_request:
    paths:
      - apps/chrome/**
      - packages/overlay-chrome-bridge/**
      - bun.lock
      - .github/workflows/chrome.yml
  push:
    branches: [main]
    paths:
      - apps/chrome/**
      - packages/overlay-chrome-bridge/**
      - bun.lock
      - .github/workflows/chrome.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chrome-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/chrome

jobs:
  check:
    name: Chrome extension typecheck, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/internal/plans/**/*.html
          sparse-checkout-cone-mode: false
      - name: Install the workspace
        uses: ./.github/actions/ci-dependencies
        with:
          node-version: 22
      - name: Bridge contract tests
        run: bun run --cwd ../../packages/overlay-chrome-bridge test
      - name: Typecheck, tests and build
        run: bun run check
