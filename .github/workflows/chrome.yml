name: Chrome extension

# Checks apps/chrome against the monorepo's current shared chat packages. The
# extension is a workspace of the root Bun install and depends on
# packages/overlay-chat-* through it.
#
# Triggers stay on the extension's own folder until it builds against the current
# shared packages; then they widen to packages/overlay-chat-*/ and packages/overlay-ui/
# (see internal/plans/MONOREPO_SURFACES_PLAN.md).
on:
  pull_request:
    paths:
      - apps/chrome/**
      - .github/workflows/chrome.yml
  push:
    branches: [main]
    paths:
      - apps/chrome/**
      - .github/workflows/chrome.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chrome-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/chrome

jobs:
  check:
    name: Chrome extension typecheck, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/internal/plans/**/*.html
          sparse-checkout-cone-mode: false
      - name: Install the workspace
        uses: ./.github/actions/ci-dependencies
        with:
          node-version: 22
      - name: Legacy API guard, typecheck, tests and build
        run: bun run check
