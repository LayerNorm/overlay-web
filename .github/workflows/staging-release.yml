name: Staging Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prepare_candidate:
        description: Build and smoke a candidate without changing canonical staging
        type: boolean
        default: false
      publish_candidate:
        description: After smoke passes, cut over a candidate with verified isolated providers
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    # Activated only after live provider isolation and authenticated smoke pass.
    # Changing the production branch alone cannot enable this migration.
    if: github.ref == 'refs/heads/main' && (vars.RELEASE_STAGING_FROM_MAIN == 'enabled' || (github.event_name == 'workflow_dispatch' && inputs.prepare_candidate))
    runs-on: ubuntu-latest
    environment: release-control
    timeout-minutes: 40
    concurrency:
      group: overlay-staging-release
      cancel-in-progress: false
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: deploy
        run: node scripts/release/staging-control.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_STAGING_TOKEN: ${{ secrets.VERCEL_STAGING_TOKEN }}
          STAGING_PREPARE_ONLY: ${{ inputs.prepare_candidate && '1' || '0' }}
      - name: Set up Node for authenticated smoke
        if: steps.deploy.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install reviewed smoke dependencies
        if: steps.deploy.outputs.ready == 'true'
        run: npm ci --ignore-scripts
      - name: Install smoke browser
        if: steps.deploy.outputs.ready == 'true'
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Verify authenticated staging behavior
        if: steps.deploy.outputs.ready == 'true'
        run: node scripts/release/staging-smoke.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_STAGING_TOKEN: ${{ secrets.VERCEL_STAGING_TOKEN }}
          STAGING_SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
      - name: Publish verified initial candidate
        id: publish
        if: steps.deploy.outputs.ready == 'true' && inputs.prepare_candidate && inputs.publish_candidate && vars.STAGING_ISOLATION_VERIFIED == 'enabled'
        run: node scripts/release/staging-publish.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_STAGING_TOKEN: ${{ secrets.VERCEL_STAGING_TOKEN }}
          STAGING_ISOLATION_VERIFIED: ${{ vars.STAGING_ISOLATION_VERIFIED }}
      - name: Verify canonical staging after cutover
        if: steps.publish.outputs.published == 'true'
        run: node scripts/release/staging-smoke.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_STAGING_TOKEN: ${{ secrets.VERCEL_STAGING_TOKEN }}
          STAGING_SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
      - name: Save promotion evidence
        if: steps.deploy.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-smoke-${{ github.sha }}
          path: staging-smoke.json
          if-no-files-found: error
          retention-days: 30
      - name: Save smoke screenshots
        if: steps.deploy.outputs.ready == 'true' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-smoke-screenshots-${{ github.sha }}
          path: staging-smoke-*.png
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: staging-deployment-${{ github.sha }}
          path: staging-deployment.json
          if-no-files-found: error
          retention-days: 30
