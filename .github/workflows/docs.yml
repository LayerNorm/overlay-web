name: Docs

on:
  pull_request:
    paths:
      - '.github/workflows/docs.yml'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-docs-health.ts'
      - 'scripts/generate-web-api-openapi.ts'
      - 'scripts/run-mint.mjs'
      - 'src/app/api/v1/**'
      - 'src/shared/schemas/**'
      - 'SECURITY.md'
      - 'README.md'
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/docs.yml'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-docs-health.ts'
      - 'scripts/generate-web-api-openapi.ts'
      - 'scripts/run-mint.mjs'
      - 'src/app/api/v1/**'
      - 'src/shared/schemas/**'
      - 'SECURITY.md'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Docs Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run docs checks
        run: npm run docs:check
