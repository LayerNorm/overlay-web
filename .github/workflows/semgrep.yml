name: Semgrep

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements.txt

      - name: Install Semgrep
        run: pip install -r .github/requirements.txt

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/typescript \
            --config p/nodejs \
            --config p/react \
            --error \
            --sarif-output semgrep.sarif

      - name: Upload Semgrep results
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # github/codeql-action/upload-sarif v4.39.4
        with:
          sarif_file: semgrep.sarif
