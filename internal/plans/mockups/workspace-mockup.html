 }
 if(q.id==='memory'&&custom){
  reviewSetup('Your context, just for you','Saved as Personal. Inviting teammates will not share this context.',`<div class="private-preview">${esc(custom)}</div>`,'Save Personal context',()=>{state.memories=[custom];advanceAnswer(false)});return;
 }
 if(q.id==='invite'&&custom){
  const emails=custom.split(/[,;\s]+/).filter(Boolean);
  if(emails.some(email=>!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))){$('#error').textContent='Enter email addresses separated by commas or spaces.';return}
  reviewSetup('Invite your team','They can join this workspace. Your Personal memories and task stay private.',emails.map(email=>`<div class="setup-row"><span>${esc(email)}</span><span class="badge">Member</span></div>`).join(''),'Preview invitations',()=>{state.invites=emails;advanceAnswer(false)});return;
 }
 advanceAnswer(false);
};
function reviewSetup(title,description,body,action,confirm){
 const dialog=$('#setup-dialog');dialog.innerHTML=`<div class="row spread"><h2 id="setup-title">${title}</h2><button class="ghost" id="close-setup" aria-label="Close">${icon('close')}</button></div><p class="setup-copy">${description}</p>${body}<p class="small muted" style="margin-top:18px">Simulation only. Nothing is saved or sent.</p><div class="actions"><button class="ghost" id="cancel-setup">Back</button><button class="primary" id="confirm-setup">${action} ${icon('arrow')}</button></div>`;
 dialog.showModal();$('#close-setup').onclick=$('#cancel-setup').onclick=()=>dialog.close();$('#confirm-setup').onclick=()=>{dialog.close();confirm()};
}
const questionnaireFinish=finish;
finish=function(){
 if(mode==='chat'||mode==='agent'){questionnaireFinish();return}
 busy=false;
 const task=answerText(answers.task||{});
 $('#thread').innerHTML=`<div class="message assistant"><h2>Let’s put that context to work.</h2><p style="margin-top:12px">Your first task is ready to create. You decide when the work starts.</p></div><div class="answer-summary"><span class="small muted">Personal task · only you</span><h3 style="margin-top:12px">${esc(task)}</h3><div class="entry"><span class="small muted">AI employees</span><span>${esc(state.employees.join(', ')||'Overlay')}</span></div><div class="entry"><span class="small muted">Connections</span><span>${esc(state.connected.join(', ')||'None connected')}</span></div><div class="entry"><span class="small muted">Personal context</span><span>${state.memories.length?'Ready to save privately':'None added'}</span></div><div class="entry"><span class="small muted">Invitations</span><span>${esc(state.invites.join(', ')||'None')}</span></div></div><p class="small muted">Preview only. No task, employee, memory, or invitation is saved.</p><div class="actions"><button class="ghost" data-action="edit">${icon('back')} Edit answers</button><button class="primary" data-action="reveal">Create task & enter workspace ${icon('arrow')}</button></div>`;
 $('.scroll').scrollTop=0;
};
const revealWorkspace=reveal;
reveal=function(){
 revealWorkspace();
 if(answers.task){$('.answer-summary .small').textContent='Personal task · preview';$('.answer-summary p').textContent='Ready to start. No work is running in this prototype.'}
 const label=$('.nav-label');
 if(label)state.employees.forEach(name=>{const row=document.createElement('button');row.className='nav-item';row.textContent=name;row.onclick=()=>toast('Employee added in this preview. No work is running.');label.insertAdjacentElement('afterend',row)});
};
const cleanReset=reset;
reset=function(){ $('#setup-dialog').close(); cleanReset() };
const stages=[['new','Full journey'],['existing','Existing workspaces'],['invite','Workspace invitation'],['intro','Orb introduction'],['name','About you'],['employees','AI employees'],['tools','Work tools'],['external','Claude Code / Codex'],['memory','Personal context'],['invite-team','Invite teammates'],['task','First task'],['workspace','Workspace & tour'],['chat','Main chat questionnaire'],['agent','Agent questionnaire']];
$('#scenario').innerHTML=(workspaceOnly?[['new','New account'],['existing','Existing workspaces'],['invite','Workspace invitation']]:stages).map(([value,label])=>`<option value="${value}">${label}</option>`).join('');
$('.preview > span').textContent=workspaceOnly?'Workspace preview':'Onboarding preview';
function previewStage(value){
 mode=['new','existing','invite','chat','agent'].includes(value)?value:'new';reset();
 if(['new','existing','invite','chat','agent'].includes(value))return;
 state.workspace='Acme studio';state.created=true;
 if(value==='intro'){intro();return}
 const samples={name:{values:['Divyansh'],custom:''},role:{values:['Engineering'],custom:''},team:{values:['A small team'],custom:''},website:{values:[],custom:'',skipped:true},daily:{values:['Coding & reviews','Research & summaries'],custom:''},employees:{values:['Engineering partner','Research assistant'],custom:''},tools:{values:['GitHub','Notion'],custom:''},external:{values:['Use Overlay employees'],custom:''},memory:{values:[],custom:'Keep updates concise. Ask before publishing changes.'},invite:{values:[],custom:'alex@example.com'},task:{values:['Plan a feature'],custom:''}};
 const id=value==='invite-team'?'invite':value;
 const order=['name','role','team','website','daily','employees','tools','external','memory','invite','task'];
 const before=value==='workspace'?order:order.slice(0,order.indexOf(id));
 before.forEach(key=>answers[key]=samples[key]);
 if(before.includes('employees'))state.employees=samples.employees.values.slice();
 if(before.includes('tools'))state.connected=['GitHub'];
 if(before.includes('memory'))state.memories=[samples.memory.custom];
 if(before.includes('invite'))state.invites=['alex@example.com'];
 if(value==='workspace'){reveal();return}
 step=onboardingItems().findIndex(q=>q.id===id);showChat();
}
$('#scenario').onchange=e=>previewStage(e.target.value);
$('#reset').onclick=()=>previewStage($('#scenario').value);
reset();

</script></body></html>
