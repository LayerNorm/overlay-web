<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Computer takeover mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fff; --card:#fff; --fg:#0a0a0a; --muted:#737373; --border:#e5e5e5; --btn:#f4f4f5; --btn-hover:#e9e9eb; --dot:#16a34a; }
  .dark { --bg:#0a0a0a; --card:#171717; --fg:#fafafa; --muted:#a1a1a1; --border:#262626; --btn:#262626; --btn-hover:#303030; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Geist, ui-sans-serif, system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  .page { max-width:640px; margin:0 auto; padding:40px 24px; }
  .bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
  h1 { font-size:18px; font-weight:600; margin:0; }
  .label { font-size:12px; color:var(--muted); margin:28px 0 8px; }
  .card { border:1px solid var(--border); background:var(--card); border-radius:12px; padding:14px 16px; display:flex; align-items:center; gap:12px; }
  .icon { width:36px; height:36px; border-radius:10px; background:var(--btn); display:flex; align-items:center; justify-content:center; color:var(--muted); flex-shrink:0; }
  .meta { flex:1; min-width:0; }
  .name { font-size:14px; font-weight:500; }
  .sub { font-size:12px; color:var(--muted); margin-top:3px; display:flex; align-items:center; gap:6px; }
  .dotx { width:6px; height:6px; border-radius:50%; background:var(--dot); }
  .dotx.you { background:#3b82f6; }
  .dotx.idle { background:var(--muted); }
  .actions { display:flex; gap:6px; }
  button { font-family:inherit; font-size:13px; font-weight:500; height:32px; padding:0 12px; border-radius:8px; border:0; background:var(--btn); color:var(--fg); cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  button:hover { background:var(--btn-hover); }
  button.icon-btn { width:32px; padding:0; justify-content:center; color:var(--muted); }
  svg { width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }
</style>
</head>
<body>
<div class="page">
  <div class="bar">
    <h1>Computers</h1>
    <button onclick="document.documentElement.classList.toggle('dark')" aria-label="Toggle theme" class="icon-btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </div>

  <div class="label">Agent is working</div>
  <div class="card">
    <div class="icon"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></div>
    <div class="meta">
      <div class="name">Research computer</div>
      <div class="sub"><span class="dotx"></span>Scout is using it</div>
    </div>
    <div class="actions">
      <button>Take control</button>
      <button>Open</button>
      <button class="icon-btn" aria-label="Stop"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></button>
    </div>
  </div>

  <div class="label">You are in control</div>
  <div class="card">
    <div class="icon"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></div>
    <div class="meta">
      <div class="name">Research computer</div>
      <div class="sub"><span class="dotx you"></span>You have control. Scout is paused.</div>
    </div>
    <div class="actions">
      <button>Hand back</button>
      <button>Open</button>
      <button class="icon-btn" aria-label="Stop"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></button>
    </div>
  </div>

  <div class="label">Idle</div>
  <div class="card">
    <div class="icon"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></div>
    <div class="meta">
      <div class="name">Research computer</div>
      <div class="sub"><span class="dotx idle"></span>Ready</div>
    </div>
    <div class="actions">
      <button>Open</button>
      <button class="icon-btn" aria-label="Stop"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></button>
    </div>
  </div>
</div>
</body>
</html>
