<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay app shell mockup: single sidebar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Libre+Baskerville&display=swap" rel="stylesheet">
<style>
/* shadcn/ui neutral tokens (new-york). Nothing here is Overlay design language except the orb + wordmark. */
:root {
  --background: #ffffff; --foreground: #0a0a0a;
  --muted: #f5f5f5; --muted-foreground: #737373;
  --accent: #f5f5f5; --border: #e5e5e5; --ring: #a3a3a3;
  --popover: #ffffff; --card: #ffffff;
  --primary: #171717; --primary-foreground: #fafafa;
  --sidebar: #fafafa; --sidebar-foreground: #0a0a0a; --sidebar-muted: #737373;
  --sidebar-accent: #efefef; --sidebar-border: #e5e5e5;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.08);
  --pop-shadow: 0 10px 30px -10px rgba(0,0,0,.2), 0 4px 10px -4px rgba(0,0,0,.08);
  --green: #16a34a; --amber: #d97706; --blue: #2563eb; --violet: #7c3aed; --red: #dc2626;
  --sans: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --serif: 'Libre Baskerville', Georgia, serif;
  --sb-w: 16rem; --sb-w-icon: 3.25rem;
}
.dark {
  --background: #141414; --foreground: #fafafa;
  --muted: #232323; --muted-foreground: #a1a1a1;
  --accent: #262626; --border: #2a2a2a; --ring: #525252;
  --popover: #1f1f1f; --card: #1a1a1a;
  --primary: #e5e5e5; --primary-foreground: #171717;
  --sidebar: #1b1b1b; --sidebar-foreground: #ededed; --sidebar-muted: #9a9a9a;
  --sidebar-accent: #2a2a2a; --sidebar-border: #2a2a2a;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  --pop-shadow: 0 16px 40px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06);
  --green: #4ade80; --amber: #fbbf24; --blue: #60a5fa; --violet: #a78bfa; --red: #f87171;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--sans); background: var(--sidebar); color: var(--foreground); font-size: 14px; -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
svg.i { width: 16px; height: 16px; flex: none; stroke-width: 2; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- shell ---------- */
.shell { display: flex; height: 100vh; }
.sidebar { width: var(--sb-w); flex: none; display: flex; flex-direction: column; background: var(--sidebar); color: var(--sidebar-foreground); transition: width .2s ease; position: relative; z-index: 2; }
.shell[data-divider="line"] .sidebar, .shell[data-divider="line"] .rail { border-right: 1px solid var(--sidebar-border); }
.shell[data-collapsed="true"] .sidebar { width: var(--sb-w-icon); }
.main-wrap { flex: 1; min-width: 0; display: flex; }
.main { flex: 1; min-width: 0; background: var(--background); overflow: auto; position: relative; }
.shell[data-divider="inset"] .main-wrap { padding: 8px 8px 8px 0; }
.shell[data-divider="inset"] .main { border-radius: 12px; box-shadow: var(--shadow); }
.shell[data-divider="inset"][data-collapsed="true"] .main-wrap { padding-left: 0; }

/* ---------- sidebar header ---------- */
.sb-head { display: flex; align-items: center; gap: 4px; padding: 10px 8px 6px 12px; height: 48px; }
.brand { display: flex; align-items: baseline; gap: .4em; font-size: 17px; flex: 1; min-width: 0; padding-left: 2px; }
.brand .orb { width: .7em; height: .7em; display: inline-flex; transform: translateY(.02em); }
.brand .orb svg { width: 100%; height: 100%; }
.brand .word { font-family: var(--serif); letter-spacing: .005em; }
.icon-btn { width: 28px; height: 28px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: var(--sidebar-muted); }
.icon-btn:hover { background: var(--sidebar-accent); color: var(--sidebar-foreground); }
.main .icon-btn { color: var(--muted-foreground); }
.main .icon-btn:hover { background: var(--accent); color: var(--foreground); }
.shell[data-collapsed="true"] .sb-head { flex-direction: column; height: auto; padding: 12px 0 6px; gap: 6px; }
.shell[data-collapsed="true"] .brand { flex: none; padding: 0; justify-content: center; font-size: 22px; }
.shell[data-collapsed="true"] .brand .word, .shell[data-collapsed="true"] .hide-collapsed { display: none !important; }

/* ---------- scope tabs (shadcn Tabs) ---------- */
.tabs { display: inline-flex; align-items: center; background: var(--muted); border-radius: 9px; padding: 3px; gap: 2px; }
.tabs button { height: 26px; padding: 0 10px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--muted-foreground); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; transition: color .15s, background .15s; }
.tabs button:hover { color: var(--foreground); }
.tabs button[aria-selected="true"] { background: var(--background); color: var(--foreground); box-shadow: var(--shadow); }
.dark .tabs button[aria-selected="true"] { background: #3a3a3a; }
.sidebar .tabs { background: var(--sidebar-accent); }
.dark .sidebar .tabs button[aria-selected="true"] { background: #3d3d3d; }
.scope { padding: 4px 8px 8px; }
.scope .tabs { display: grid; grid-template-columns: 1fr 1fr; width: 100%; }
.scope .tabs button { justify-content: center; }
.scope-icon { display: none; }
.shell[data-collapsed="true"] .scope { display: flex; justify-content: center; padding: 2px 0 8px; }
.shell[data-collapsed="true"] .scope .tabs { display: none; }
.shell[data-collapsed="true"] .scope-icon { display: inline-flex; }

/* ---------- sidebar menu (shadcn SidebarMenu) ---------- */
.sb-content { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 0 8px 8px; scrollbar-width: thin; scrollbar-color: transparent transparent; }
.sb-content:hover { scrollbar-color: var(--sidebar-accent) transparent; }
.menu { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.mbtn { width: 100%; height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border-radius: 7px; font-size: 14px; color: var(--sidebar-foreground); text-align: left; position: relative; }
.mbtn:hover { background: var(--sidebar-accent); }
.mbtn[aria-current="page"] { background: var(--sidebar-accent); font-weight: 500; }
.mbtn .lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mbtn .trail { color: var(--sidebar-muted); display: inline-flex; }
.mbtn .hint { color: var(--sidebar-muted); font-size: 12px; }
.mbtn .badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--sidebar-accent); font-size: 11px; display: inline-flex; align-items: center; justify-content: center; color: var(--sidebar-foreground); }
.shell[data-collapsed="true"] .sb-content { padding: 0 8px; }
.shell[data-collapsed="true"] .mbtn { justify-content: center; padding: 0; height: 36px; }
.shell[data-collapsed="true"] .mbtn .lbl, .shell[data-collapsed="true"] .mbtn .trail, .shell[data-collapsed="true"] .mbtn .hint, .shell[data-collapsed="true"] .mbtn .badge { display: none; }

.group { margin-top: 18px; }
.glabel { height: 30px; display: flex; align-items: center; padding: 0 8px; gap: 4px; font-size: 12px; font-weight: 500; color: var(--sidebar-muted); border-radius: 7px; width: 100%; }
.glabel:hover { color: var(--sidebar-foreground); }
.glabel .chev { transition: transform .15s; width: 14px; height: 14px; }
.group[data-open="false"] .glabel .chev { transform: rotate(-90deg); }
.group[data-open="false"] .menu { display: none; }
.glabel .gact { margin-left: auto; opacity: 0; }
#chatGroups .group:first-child { margin-top: 10px; }
#chatGroups .unread .lbl { font-weight: 600 !important; }
.htitle { display: inline-flex; align-items: center; gap: 8px; }
.htitle .hash { color: var(--muted-foreground); display: inline-flex; }
.group:hover .glabel .gact { opacity: 1; }
.item { height: 32px; font-size: 14px; }
.item .lead { color: var(--sidebar-muted); display: inline-flex; }
.item .lead.done { color: var(--green); }
.item .more { display: none; color: var(--sidebar-muted); }
.item:hover .more, .item[aria-current="page"] .more { display: inline-flex; }
.item[aria-current="page"] .meta { display: none; }
.item .meta { color: var(--sidebar-muted); font-size: 12px; }
.item:hover .meta { display: none; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; margin: 0 4.5px; }
.ava { width: 20px; height: 20px; border-radius: 50%; flex: none; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: #fff; }

/* ---------- sidebar footer ---------- */
.sb-foot { padding: 8px; }
.acct { height: 48px; padding: 0 8px; gap: 10px; }
.acct .tile { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex: none; }
.acct .tile.round { border-radius: 50%; background: linear-gradient(135deg, #f59e0b, #ef4444); }
.acct .txt { display: flex; flex-direction: column; min-width: 0; flex: 1; line-height: 1.25; }
.acct .txt b { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acct .txt small { font-size: 12px; color: var(--sidebar-muted); }
.shell[data-collapsed="true"] .acct { padding: 0; justify-content: center; }
.shell[data-collapsed="true"] .acct .txt, .shell[data-collapsed="true"] .acct .trail { display: none; }

/* ---------- classic two-rail layout (settings option) ---------- */
.rail { display: none; width: 3.25rem; flex: none; flex-direction: column; align-items: center; padding: 12px 0 8px; gap: 2px; background: var(--sidebar); }
.rail .brand { flex: none; padding: 0; font-size: 22px; justify-content: center; margin-bottom: 10px; }
.rail .brand .word { display: none; }
.rail .mbtn { width: 36px; height: 36px; justify-content: center; padding: 0; }
.rail .mbtn .lbl { display: none; }
.rail .spacer { flex: 1; }
.shell[data-layout="classic"] .rail { display: flex; }
.shell[data-layout="classic"] .sidebar .brand, .shell[data-layout="classic"] .sidebar .nav-main, .shell[data-layout="classic"] .sidebar .sb-foot { display: none; }
.shell[data-layout="classic"] .sidebar .sb-head { padding-left: 16px; }
.shell[data-layout="classic"] .sidebar .panel-title { display: block; }
.shell[data-layout="classic"] .sidebar .subviews { display: flex; }
.shell[data-layout="classic"] .page-tabs { display: none !important; }
.shell[data-layout="classic"][data-divider="none"] .sidebar { background: var(--sidebar); }
.shell[data-layout="classic"] .rail { border-right: 1px solid var(--sidebar-border); }
.panel-title { display: none; flex: 1; font-weight: 600; font-size: 14px; }
.subviews { display: none; flex-direction: column; gap: 1px; margin-top: 4px; }

/* ---------- header (no divider line, blurred) ---------- */
.header { position: sticky; top: 0; z-index: 5; height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 20px 0 24px;
  background: color-mix(in srgb, var(--background) 70%, transparent);
  -webkit-backdrop-filter: blur(14px) saturate(1.5); backdrop-filter: blur(14px) saturate(1.5); }
.header .open-sb { display: none; margin-left: -8px; }
.shell[data-collapsed="true"] .header .open-sb { display: none; }
.header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.005em; white-space: nowrap; }
.header .crumb { color: var(--muted-foreground); font-weight: 400; }
.header .spacer { flex: 1; }
.btn { height: 32px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn-primary { background: var(--primary); color: var(--primary-foreground); }
.btn-primary:hover { opacity: .9; }
.btn-outline { box-shadow: inset 0 0 0 1px var(--border); background: var(--background); }
.btn-outline:hover { background: var(--accent); }
.btn-ghost:hover { background: var(--accent); }
.btn svg.i { width: 15px; height: 15px; }

/* ---------- page body ---------- */
.body { padding: 4px 24px 48px; max-width: 1180px; }
.body.wide { max-width: none; }
.sec-label { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--muted-foreground); padding: 18px 8px 6px; }
.sec-label .n { font-weight: 400; }
.row { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 8px; border-radius: 8px; font-size: 14px; }
.row:hover { background: var(--accent); }
.row .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .m { color: var(--muted-foreground); font-size: 13px; white-space: nowrap; }
.chip { height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; background: var(--muted); color: var(--muted-foreground); white-space: nowrap; }
.st-prog { color: var(--amber); } .st-todo { color: var(--muted-foreground); } .st-done { color: var(--green); } .st-review { color: var(--violet); }

.board { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 14px; padding-top: 8px; overflow-x: auto; }
.col { background: var(--muted); border-radius: 12px; padding: 8px; min-height: 60vh; }
.dark .col { background: #1a1a1a; }
.col-h { display: flex; align-items: center; gap: 8px; padding: 4px 6px 10px; font-size: 13px; font-weight: 500; }
.col-h .n { color: var(--muted-foreground); font-weight: 400; }
.card { background: var(--card); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; box-shadow: var(--shadow); font-size: 13.5px; line-height: 1.4; }
.dark .card { background: #232323; box-shadow: none; }
.card .foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--muted-foreground); font-size: 12px; }
.card .foot .ava { margin-left: auto; }

.tl { position: relative; padding-top: 8px; }
.tl-head { display: grid; grid-template-columns: 220px repeat(14, 1fr); font-size: 12px; color: var(--muted-foreground); padding: 0 0 8px; }
.tl-head span { text-align: center; }
.tl-row { display: grid; grid-template-columns: 220px repeat(14, 1fr); align-items: center; height: 40px; border-radius: 8px; }
.tl-row:hover { background: var(--accent); }
.tl-row .t { padding: 0 8px; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 24px; border-radius: 6px; font-size: 12px; display: flex; align-items: center; padding: 0 8px; color: var(--foreground); white-space: nowrap; overflow: hidden; }
.today { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--red); opacity: .6; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; padding-top: 8px; }
.tile-card { border-radius: 12px; padding: 14px; background: var(--muted); display: flex; flex-direction: column; gap: 10px; min-height: 128px; }
.dark .tile-card { background: #1b1b1b; }
.tile-card:hover { background: var(--accent); }
.tile-card .top { display: flex; align-items: center; gap: 10px; }
.tile-card .logo { width: 32px; height: 32px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; background: var(--background); flex: none; }
.dark .tile-card .logo { background: #2a2a2a; }
.tile-card .name { font-weight: 500; }
.tile-card .desc { color: var(--muted-foreground); font-size: 13px; line-height: 1.45; flex: 1; }
.tile-card .bottom { display: flex; align-items: center; justify-content: space-between; }

.chat { max-width: 720px; margin: 0 auto; padding: 8px 0 160px; display: flex; flex-direction: column; gap: 22px; }
.msg-u { align-self: flex-end; background: var(--muted); padding: 10px 14px; border-radius: 18px; max-width: 80%; line-height: 1.5; }
.msg-a { line-height: 1.65; }
.msg-a p { margin: 0 0 10px; }
.msg-a ul { margin: 0 0 10px; padding-left: 20px; }
.msg-from { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
.msg-from small { color: var(--muted-foreground); font-weight: 400; }
.composer-wrap { position: sticky; bottom: 0; padding: 0 24px 20px; background: linear-gradient(transparent, var(--background) 30%); }
.composer { max-width: 720px; margin: 0 auto; border-radius: 22px; background: var(--muted); padding: 12px 12px 10px 18px; }
.dark .composer { background: #222; }
.composer .ph { color: var(--muted-foreground); padding: 4px 0 14px; }
.composer .ctl { display: flex; align-items: center; gap: 6px; }
.composer .send { margin-left: auto; width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: var(--primary-foreground); display: inline-flex; align-items: center; justify-content: center; }
.switch { width: 32px; height: 18px; border-radius: 9px; background: var(--border); position: relative; flex: none; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--background); transition: left .15s; box-shadow: var(--shadow); }
.switch.on { background: var(--primary); }
.switch.on::after { left: 16px; }

/* ---------- popovers / menus / dialog ---------- */
.pop { position: fixed; z-index: 50; min-width: 200px; background: var(--popover); color: var(--foreground); border-radius: 12px; padding: 5px; box-shadow: var(--pop-shadow); display: none; }
.light-border .pop, :root:not(.dark) .pop { box-shadow: var(--pop-shadow), 0 0 0 1px var(--border); }
.pop.open { display: block; animation: pop .12s ease-out; }
@keyframes pop { from { opacity: 0; transform: scale(.97); } }
.pop .mi { width: 100%; height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 7px; font-size: 14px; text-align: left; }
.pop .mi:hover { background: var(--accent); }
.pop .mi .k { margin-left: auto; color: var(--muted-foreground); font-size: 12px; }
.pop .sep { height: 1px; background: var(--border); margin: 5px -5px; }
.pop .lab { font-size: 12px; color: var(--muted-foreground); padding: 6px 10px 4px; }
.pop .head { display: flex; gap: 10px; align-items: center; padding: 8px 10px; }
.pop .head small { display: block; color: var(--muted-foreground); font-size: 12px; }
.overlay-bg { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; }
.overlay-bg.open { display: flex; }
.dialog { width: min(720px, 92vw); height: min(520px, 86vh); background: var(--background); border-radius: 16px; box-shadow: var(--pop-shadow); display: flex; overflow: hidden; }
.dialog nav { width: 200px; background: var(--sidebar); padding: 12px 8px; display: flex; flex-direction: column; gap: 1px; }
.dialog nav .mbtn { height: 32px; }
.dialog .dbody { flex: 1; padding: 20px 24px; overflow: auto; position: relative; }
.dialog h2 { margin: 0 0 18px; font-size: 16px; font-weight: 600; }
.setting { display: flex; gap: 16px; padding: 14px 0; }
.setting + .setting { box-shadow: 0 -1px 0 var(--border); }
.setting .sl { flex: 1; }
.setting .sl b { font-weight: 500; display: block; margin-bottom: 3px; }
.setting .sl small { color: var(--muted-foreground); font-size: 13px; line-height: 1.45; }
.layout-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
.lopt { border-radius: 12px; padding: 10px; box-shadow: inset 0 0 0 1px var(--border); text-align: left; }
.lopt[aria-checked="true"] { box-shadow: inset 0 0 0 2px var(--foreground); }
.lopt .pv { height: 84px; border-radius: 8px; background: var(--muted); display: flex; gap: 4px; padding: 6px; margin-bottom: 8px; }
.lopt .pv i { display: block; border-radius: 4px; background: var(--border); }
.lopt .pv i.main { flex: 1; background: var(--background); }
.lopt b { font-weight: 500; font-size: 13px; display: block; }
.lopt small { color: var(--muted-foreground); font-size: 12px; }

/* tooltips for icon-mode */
.tip { position: fixed; z-index: 70; background: var(--primary); color: var(--primary-foreground); font-size: 12px; padding: 5px 8px; border-radius: 6px; pointer-events: none; display: none; white-space: nowrap; }

/* mockup-only controls */
.mock { position: fixed; right: 14px; bottom: 14px; z-index: 80; display: flex; gap: 8px; align-items: center; background: var(--popover); padding: 6px 6px 6px 12px; border-radius: 12px; box-shadow: var(--pop-shadow); font-size: 12px; color: var(--muted-foreground); }
:root:not(.dark) .mock { box-shadow: var(--pop-shadow), 0 0 0 1px var(--border); }
.mock .tabs button { height: 24px; font-size: 12px; padding: 0 8px; }
.mock .x { width: 24px; height: 24px; }

@media (max-width: 760px) {
  .sidebar, .rail { position: fixed; inset: 0 auto 0 0; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--pop-shadow); z-index: 40; }
  .shell[data-mobile-open="true"] .sidebar { transform: none; }
  .header .open-sb { display: inline-flex !important; }
  .shell[data-divider="inset"] .main-wrap { padding: 0; }
  .shell[data-divider="inset"] .main { border-radius: 0; }
  .header .page-tabs .lbl-long { display: none; }
  .mock { display: none; }
}
</style>
</head>
<body>
<div class="shell" id="shell" data-layout="single" data-divider="none" data-collapsed="false">
  <!-- classic layout only: icon rail -->
  <nav class="rail" id="rail" aria-label="Primary"></nav>

  <aside class="sidebar" id="sidebar" aria-label="Sidebar">
    <div class="sb-head">
      <div class="brand"><span class="orb" id="orbSlot"></span><span class="word">overlay</span></div>
      <div class="panel-title" id="panelTitle"></div>
      <button class="icon-btn hide-collapsed" data-tip="Search  Ctrl K" aria-label="Search">__I:search__</button>
      <button class="icon-btn" id="collapseBtn" data-tip="Toggle sidebar  Ctrl B" aria-label="Toggle sidebar">__I:panel-left__</button>
    </div>
    <div class="scope">
      <div class="tabs" role="tablist" id="scopeTabs">
        <button role="tab" data-scope="personal">Personal</button>

/* ---------------- popovers ---------------- */
function closePops() { document.querySelectorAll('.pop').forEach(p => p.classList.remove('open')); }
function placePop(pop, anchor, side) {
  const r = anchor.getBoundingClientRect();
  pop.classList.add('open');
  const pr = pop.getBoundingClientRect();
  if (side === 'right') { pop.style.left = (r.right + 8) + 'px'; pop.style.top = Math.min(r.top - 5, innerHeight - pr.height - 8) + 'px'; }
  else { pop.style.left = (r.left) + 'px'; pop.style.top = (r.top - pr.height - 6) + 'px'; if (S.collapsed) { pop.style.left = (r.right + 8) + 'px'; pop.style.top = (r.bottom - pr.height) + 'px'; } }
}
function openExplore(anchor) {
  const pop = $('explorePop');
  pop.innerHTML = EXPLORE.map(id => `<button class="mi" data-nav="${id}">${ic(PAGES[id].icon)}${PAGES[id].label}</button>`).join('');
  placePop(pop, anchor, 'right');
}
function openAcct(anchor) {
  const pop = $('acctPop');
  pop.innerHTML = `<div class="head"><span class="ava" style="width:32px;height:32px;background:linear-gradient(135deg,#f59e0b,#ef4444);font-size:12px">DL</span><div><div style="font-weight:500">Divyansh Lalwani</div><small>divyansh@layernorm.co</small></div></div>
    <div class="sep"></div><div class="lab">Workspaces</div>
    <button class="mi"><span class="ava" style="border-radius:6px;background:linear-gradient(135deg,#6366f1,#8b5cf6)">A</span>Acme Inc<span class="k">${ic('check')}</span></button>
    <button class="mi"><span class="ava" style="border-radius:6px;background:linear-gradient(135deg,#10b981,#0ea5e9)">L</span>LayerNorm</button>
    <button class="mi">${ic('plus')}New workspace</button>
    <div class="sep"></div>
    <button class="mi" data-open-settings>${ic('settings')}Settings<span class="k">Ctrl ,</span></button>
    <button class="mi">${ic('credit-card')}Billing</button>
    <button class="mi" id="menuTheme">${ic(S.theme === 'dark' ? 'sun' : 'moon')}${S.theme === 'dark' ? 'Light mode' : 'Dark mode'}</button>
    <button class="mi">${ic('circle-help')}Help</button>
    <div class="sep"></div>
    <button class="mi">${ic('log-out')}Log out</button>`;
  placePop(pop, anchor, 'top');
}
function openSettings() {
  closePops();
  $('setNav').innerHTML = [['General','settings'],['Account','user'],['Workspace','users'],['Appearance','sun'],['Models','sparkles'],['Shortcuts','zap']].map(([l, i]) => `<button class="mbtn" ${l === 'Appearance' ? 'aria-current="page"' : ''}>${ic(i)}<span class="lbl">${l}</span></button>`).join('');
  $('settings').classList.add('open');
}

/* ---------------- events ---------------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('button, .overlay-bg');
  if (!t) { closePops(); return; }
  if (t.id === 'settings' && e.target === t) { t.classList.remove('open'); return; }
  if (t.closest('#explorePop') == null && t.id !== 'exploreBtn' && t.closest('#acctPop') == null && t.id !== 'acctBtn' && t.id !== 'railAcct') closePops();
  if (t.dataset.nav) { S.page = t.dataset.nav; S.activeItem = 0; closePops(); shell.dataset.mobileOpen = 'false'; render(); $('main').scrollTop = 0; return; }
  if (t.dataset.sub) { S.sub[S.page] = t.dataset.sub; S.activeItem = 0; render(); return; }
  if (t.dataset.scope) { S.scope = t.dataset.scope; S.activeItem = 0; render(); return; }
  if (t.dataset.chat) { const [k, i] = t.dataset.chat.split(':'); S.chat = { kind: k, i: +i || 0 }; shell.dataset.mobileOpen = 'false'; render(); return; }
  if (t.dataset.group) { if (e.target.closest('.gact')) return; S.groups[t.dataset.group] = !S.groups[t.dataset.group]; renderList(); return; }
  if (t.dataset.item && S.page === 'chat') { S.activeItem = +t.dataset.item; render(); return; }
  if (t.dataset.item) { S.activeItem = +t.dataset.item; renderList(); return; }
  if (t.dataset.divider) { S.divider = t.dataset.divider; render(); return; }
  if (t.dataset.layout) { S.layout = t.dataset.layout; render(); return; }
  if (t.dataset.theme) { S.theme = t.dataset.theme; render(); return; }
  if (t.hasAttribute('data-open-settings')) { openSettings(); return; }
  switch (t.id) {
    case 'exploreBtn': openExplore(t); break;
    case 'acctBtn': case 'railAcct': $('acctPop').classList.contains('open') ? closePops() : openAcct(t); break;
    case 'collapseBtn': if (innerWidth <= 760) shell.dataset.mobileOpen = 'false'; else { S.collapsed = !S.collapsed; render(); } break;
    case 'collapseSwitch': S.collapsed = !S.collapsed; render(); break;
    case 'openSb': shell.dataset.mobileOpen = 'true'; break;
    case 'scopeIcon': S.scope = S.scope === 'personal' ? 'workspace' : 'personal'; render(); break;
    case 'listToggle': S.listOpen = !S.listOpen; renderList(); break;
    case 'themeBtn': case 'menuTheme': S.theme = S.theme === 'dark' ? 'light' : 'dark'; closePops(); render(); break;
    case 'closeSettings': $('settings').classList.remove('open'); break;
  }
});
let exploreT;
document.addEventListener('mouseover', (e) => {
  const btn = e.target.closest('#exploreBtn'), pop = $('explorePop');
  if (btn || e.target.closest('#explorePop')) { clearTimeout(exploreT); if (btn && !pop.classList.contains('open') && matchMedia('(hover: hover)').matches) openExplore(btn); return; }
  if (pop.classList.contains('open')) { clearTimeout(exploreT); exploreT = setTimeout(() => pop.classList.remove('open'), 200); }
});
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') { e.preventDefault(); S.collapsed = !S.collapsed; render(); }
  if ((e.ctrlKey || e.metaKey) && e.key === ',') { e.preventDefault(); openSettings(); }
  if (e.key === 'Escape') { closePops(); $('settings').classList.remove('open'); }
});
// tooltips only in icon mode (collapsed sidebar or rail)
const tip = $('tip');
document.addEventListener('mouseover', (e) => {
  const b = e.target.closest('[data-tip]');
  const iconMode = b && (b.closest('.rail') || (shell.dataset.collapsed === 'true' && b.closest('.sidebar')) || b.classList.contains('icon-btn'));
  if (!iconMode) { tip.style.display = 'none'; return; }
  const r = b.getBoundingClientRect();
  tip.textContent = b.dataset.tip; tip.style.display = 'block';
  if (b.closest('.sb-head') && shell.dataset.collapsed !== 'true') { tip.style.left = (r.left + r.width / 2 - tip.offsetWidth / 2) + 'px'; tip.style.top = (r.bottom + 6) + 'px'; }
  else { tip.style.left = (r.right + 8) + 'px'; tip.style.top = (r.top + r.height / 2 - tip.offsetHeight / 2) + 'px'; }
});
render();
</script>
</body>
</html>
