<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overlay logo directions</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafafa;--fg:#0a0a0a;--muted:#71717a;--card:#fff;--line:#e4e4e7;--ink:#18181b;--back:#a1a1aa;--eye:#fafafa;--side:#f4f4f5}
html.dark{--bg:#0a0a0a;--fg:#fafafa;--muted:#a1a1aa;--card:#141414;--line:#27272a;--ink:#f4f4f5;--back:#52525b;--eye:#0a0a0a;--side:#171717}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Libre Baskerville',serif;transition:background .2s}
header{display:flex;justify-content:space-between;align-items:center;padding:28px 40px}
h1{font-size:22px;font-weight:400;margin:0}
button{font:inherit;font-size:13px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;padding:0 40px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:22px}
.card.rec{border-color:var(--fg)}
.hero{display:flex;justify-content:center;padding:18px 0}
.name{font-size:15px}.note{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:4px}
.lockup{display:inline-flex;align-items:baseline;gap:.4em;font-size:22px;letter-spacing:-.01em}
.lockup svg{width:.62em;height:.62em;align-self:center;transform:translateY(.03em)}
.sizes{display:flex;align-items:center;gap:14px;justify-content:space-between}
.sizes .s{display:flex;align-items:center;gap:14px}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
section.av{padding:0 40px 60px}
section.av h2{font-size:17px;font-weight:400;margin:10px 0 16px}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.side{background:var(--side);border:1px solid var(--line);border-radius:14px;padding:16px;font-family:ui-sans-serif,system-ui,sans-serif;font-size:13.5px}
.side .hd{margin-bottom:14px;font-family:'Libre Baskerville',serif}
.row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px}
.row.on{background:var(--line)}
.side .cap{font-size:11px;color:var(--muted);margin:2px 8px 6px}
.lbl{font-family:'Libre Baskerville',serif;font-size:14px;margin-top:12px}
</style>
</head>
<body>
<header><h1>Overlay logo directions</h1><button onclick="document.documentElement.classList.toggle('dark')">Light / dark</button></header>
<div class="grid" id="grid"></div>
<section class="av">
  <h2>Default Overlay agent avatar</h2>
  <div class="avgrid" id="av"></div>
</section>
<script>
const EYES=(c='var(--eye)',dx=0,dy=0,s=1)=>`<g fill="${c}" transform="translate(${dx} ${dy}) translate(50 53) scale(${s}) translate(-50 -53)"><rect x="36" y="45" width="9.5" height="17" rx="4.75"/><rect x="54.5" y="45" width="9.5" height="17" rx="4.75"/></g>`;
let uid=0;
const metal=()=>{const i='m'+(uid++);return `<defs><radialGradient id="${i}" cx="38%" cy="28%" r="78%"><stop offset="0" stop-color="#fff"/><stop offset=".22" stop-color="#eceef1"/><stop offset=".46" stop-color="#a8adb5"/><stop offset=".72" stop-color="#4c5158"/><stop offset="1" stop-color="#17191d"/></radialGradient></defs><circle cx="50" cy="50" r="46" fill="url(#${i})"/><ellipse cx="36" cy="29" rx="13" ry="8" fill="#fff" opacity=".85" transform="rotate(-24 36 29)"/>`};
const MARKS={
  overlay:{name:'Overlay',note:'A lead agent overlapping the one behind it. The chief of staff in front of the team, and literally an overlay.',rec:true,
    svg:()=>`<circle cx="36" cy="44" r="30" fill="var(--back)"/><circle cx="58" cy="58" r="34" fill="var(--ink)"/>${EYES('var(--eye)',8,5,.85)}`},
  awake:{name:'Awake orb',note:'Today\'s metal orb, now with eyes. Same brand, but it reads as someone, not something.',
    svg:()=>metal()+EYES('#17191d',0,-3,.9)},
  team:{name:'Team',note:'One agent leading two. Says "you manage a team" at a glance.',
    svg:()=>`<circle cx="22" cy="42" r="17" fill="var(--back)"/><circle cx="78" cy="42" r="17" fill="var(--back)"/><circle cx="50" cy="58" r="30" fill="var(--ink)"/>${EYES('var(--eye)',0,4,.75)}`},
  collar:{name:'Collar',note:'An agent with a shirt collar. The employee, dressed for work.',
    svg:()=>`<circle cx="50" cy="50" r="44" fill="var(--ink)"/>${EYES('var(--eye)',0,-8,.85)}<path d="M36 80 L50 70 L64 80 L50 94 Z" fill="var(--eye)"/><path d="M50 70 L50 94" stroke="var(--ink)" stroke-width="3"/>`},
  o:{name:'Monogram',note:'The lowercase o of the wordmark, looking back at you. Most typographic, least literal.',
    svg:()=>`<circle cx="50" cy="52" r="34" fill="none" stroke="var(--ink)" stroke-width="16"/>${EYES('var(--ink)',0,-1,.6)}`},
};
const mk=(k,sz)=>`<svg viewBox="0 0 100 100" width="${sz}" height="${sz}" aria-label="${MARKS[k].name}">${MARKS[k].svg()}</svg>`;
const creature=(shape,color,sz)=>{const b={circle:'<circle cx="50" cy="53" r="40"/>',squircle:'<rect x="12" y="14" width="76" height="78" rx="24"/>',blob:'<path d="M50 12 C70 12 90 28 89 55 C88 80 70 93 50 93 C30 93 11 80 12 54 C13 29 30 12 50 12 Z"/>',hexagon:'<path d="M50 12 L84 31 L84 71 L50 90 L16 71 L16 31 Z" stroke="currentColor" stroke-width="7" stroke-linejoin="round"/>'}[shape];return `<svg viewBox="0 0 100 100" width="${sz}" height="${sz}"><g fill="${color}" color="${color}">${b}</g>${EYES('#fafafa')}</svg>`};
document.getElementById('grid').innerHTML=Object.keys(MARKS).map(k=>`
<div class="card${MARKS[k].rec?' rec':''}">
  <div class="hero">${mk(k,120)}</div>
  <div class="sizes"><span class="lockup">${mk(k,20)}overlay</span><span class="s">${mk(k,32)}${mk(k,20)}${mk(k,14)}</span></div>
  <div><div class="name">${MARKS[k].name} ${MARKS[k].rec?'<span class="tag">recommended</span>':''}</div><div class="note">${MARKS[k].note}</div></div>
</div>`).join('');
const others=`<div class="row">${creature('squircle','#f97316',20)}Sales</div><div class="row">${creature('blob','#3b82f6',20)}Research</div><div class="row">${creature('hexagon','#10b981',20)}Support</div>`;
document.getElementById('av').innerHTML=`
<div><div class="side"><div class="hd"><span class="lockup" style="font-size:18px">${mk('overlay',18)}overlay</span></div><div class="cap">Agents</div><div class="row on">${mk('overlay',20)}Overlay</div>${others}</div>
<div class="lbl">A. The logo is the Overlay agent <span class="tag">recommended</span></div><div class="note">Your chief of staff wears the brand. Every other agent stays a creature.</div></div>
<div><div class="side"><div class="hd"><span class="lockup" style="font-size:18px">${mk('overlay',18)}overlay</span></div><div class="cap">Agents</div><div class="row on">${creature('circle','#64748b',20)}Overlay</div>${others}</div>
<div class="lbl">B. Keep today's gray creature</div><div class="note">Simplest. The Overlay agent looks like any other agent.</div></div>`;
</script>
</body>
</html>
