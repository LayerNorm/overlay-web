<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overlay brand rollout</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafafa;--fg:#0a0a0a;--muted:#71717a;--card:#fff;--line:#e4e4e7;--side:#f4f4f5;--bubble:#f4f4f5}
html.dark{--bg:#0a0a0a;--fg:#fafafa;--muted:#a1a1aa;--card:#141414;--line:#27272a;--side:#171717;--bubble:#1f1f1f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Libre Baskerville',serif}
header.top{display:flex;justify-content:space-between;align-items:center;padding:28px 40px}
h1{font-size:22px;font-weight:400;margin:0}
h2{font-size:15px;font-weight:400;color:var(--muted);margin:0 0 12px}
button{font:inherit;font-size:13px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
main{padding:0 40px 60px;display:flex;flex-direction:column;gap:36px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sans{font-family:ui-sans-serif,system-ui,sans-serif}
/* mark */
svg.mark{display:inline-block;flex-shrink:0;overflow:visible}
svg.mark path{fill:currentColor}
svg.word{display:block;overflow:visible}svg.word path{fill:currentColor}
.eyes{transform-box:fill-box;transform-origin:center}
.blink .eyes{animation:blink 6s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.1)}}
.look .eyes{animation:look 2.4s ease-in-out infinite}
@keyframes look{0%,100%{transform:translateX(0)}20%,40%{transform:translateX(-95px)}60%,80%{transform:translateX(95px)}}
@media (prefers-reduced-motion:reduce){.look .eyes,.blink .eyes{animation:none}}
/* assets */
.assets{display:grid;grid-template-columns:repeat(4,1fr)}
.assets>div{display:flex;align-items:center;justify-content:center;height:180px;border-right:1px solid var(--line)}
.assets>div:last-child{border:0}
.assets .inv{background:var(--fg);color:var(--bg)}
.icon{display:flex;align-items:center;justify-content:center;border-radius:22%;background:#0a0a0a;color:#fafafa}
.icon.l{background:#fafafa;color:#0a0a0a;border:1px solid #e4e4e7}
/* landing */
.landing{display:flex;justify-content:space-between;align-items:center;padding:20px 28px;border-bottom:1px solid var(--line)}
.landing nav{display:flex;gap:22px;font-size:14px;color:var(--muted)}
.lhero{padding:70px 28px;text-align:center;font-size:40px}
/* app */
.app{display:grid;grid-template-columns:240px 1fr;height:560px}
.sb{background:var(--side);border-right:1px solid var(--line);padding:16px 10px;font-size:13.5px}
.sb .hd{padding:2px 8px 14px}
.cap{font-size:11px;color:var(--muted);margin:14px 8px 6px}
.r{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px}
.r.on{background:var(--line)}
.chat{display:flex;flex-direction:column}
.chat .ch{display:flex;align-items:center;gap:10px;padding:14px 22px;border-bottom:1px solid var(--line);font-size:14px}
.msgs{flex:1;padding:24px 22px;display:flex;flex-direction:column;gap:18px;font-size:14px;line-height:1.55}
.u{align-self:flex-end;background:var(--bubble);padding:9px 14px;border-radius:14px;max-width:60%}
.tool{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.loading{display:flex;align-items:center;gap:8px}
.comp{margin:0 22px 20px;border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--muted);font-size:14px}
/* boot + tab + email */
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
.boot{height:240px;display:flex;align-items:center;justify-content:center}
.tab{padding:18px}
.tabbar{display:flex;gap:6px;background:var(--side);border-radius:10px 10px 0 0;padding:8px 8px 0}
.t{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:8px 8px 0 0;padding:8px 12px;font-size:12px;width:180px}
.t.off{background:transparent;color:var(--muted)}
.url{border:1px solid var(--line);border-top:0;padding:10px 12px;font-size:12px;color:var(--muted);border-radius:0 0 10px 10px}
.email{padding:24px;background:#fff;color:#0a0a0a;font-size:13px;line-height:1.6;height:100%}
</style>
</head>
<body>
<header class="top"><h1>Overlay brand rollout</h1><button onclick="document.documentElement.classList.toggle('dark')">Light / dark</button></header>
<main id="m"></main>
