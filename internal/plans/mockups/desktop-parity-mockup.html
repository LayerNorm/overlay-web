<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay Desktop, full surface mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#fff;--fg:#0a0a0a;--muted:#f5f5f5;--muted-fg:#737373;--border:#e5e5e5;--side:#fafafa;--acc:#f0f0f0;--card:#fff;--ring:#a3a3a3;--agent:#f59e0b;--wall:#d9dde3;--ok:#16a34a}
[data-theme=dark]{--bg:#0a0a0a;--fg:#fafafa;--muted:#262626;--muted-fg:#a3a3a3;--border:#262626;--side:#171717;--acc:#262626;--card:#171717;--ring:#525252;--wall:#1c1f24}
*{box-sizing:border-box;margin:0}
body{font-family:Geist,system-ui,sans-serif;font-size:14px;color:var(--fg);background:var(--wall);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 16px 40px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.i{width:16px;height:16px;stroke-width:1.75;flex:none}
.bar{display:flex;gap:4px;margin-bottom:12px;background:var(--bg);padding:4px;border-radius:10px}
.bar button{padding:5px 10px;border-radius:7px;color:var(--muted-fg);font-size:13px}
.bar button.on{background:var(--acc);color:var(--fg)}
.win{width:1280px;height:800px;background:var(--bg);border-radius:12px;box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 24px 60px rgba(0,0,0,.25);display:flex;overflow:hidden;position:relative}
.side{width:240px;background:var(--side);display:flex;flex-direction:column;padding:0 8px 8px;flex:none}
.tl{display:flex;gap:8px;padding:16px 8px 12px}
.tl i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.tl i:nth-child(2){background:#febc2e}.tl i:nth-child(3){background:#28c840}
.ws{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;width:100%;text-align:left}
.ws:hover,.nav a:hover{background:var(--acc)}
.lock{font-family:'Libre Baskerville',serif;font-size:17px;display:inline-flex;align-items:baseline;gap:.4em}
.lock svg{width:.5em;height:.5em;transform:translateY(-.02em)}
.ws small{display:block;color:var(--muted-fg);font-size:12px}
.nav{display:flex;flex-direction:column;gap:1px;margin-top:8px}
.nav .lbl{font-size:12px;color:var(--muted-fg);padding:14px 8px 6px}
.nav a{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;color:var(--fg);text-decoration:none;height:32px}
.nav a.on{background:var(--acc);font-weight:500}
.nav a .k{margin-left:auto;color:var(--muted-fg);font-size:12px}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.meter{padding:10px;border-radius:10px;background:var(--acc);font-size:12px;color:var(--muted-fg)}
.meter b{display:block;height:4px;border-radius:2px;background:var(--border);margin-top:6px;overflow:hidden}.meter b i{display:block;height:100%;width:38%;background:var(--fg);opacity:.6}
.me{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;width:100%}
.me:hover{background:var(--acc)}
.av{width:24px;height:24px;border-radius:50%;background:#d4d4d4;display:grid;place-items:center;font-size:11px;font-weight:500;color:#404040;flex:none}
.cr{width:22px;height:22px;flex:none}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:52px;display:flex;align-items:center;gap:8px;padding:0 16px;flex:none}
.crumb{display:flex;align-items:center;gap:6px;color:var(--muted-fg)}.crumb b{color:var(--fg);font-weight:500}
.top .r{margin-left:auto;display:flex;gap:4px}
.ib{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted-fg)}
.ib:hover{background:var(--acc);color:var(--fg)}
.btn{height:32px;padding:0 12px;border-radius:8px;background:var(--acc);display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:13px}
.btn:hover{background:var(--border)}
.body{flex:1;overflow:auto;padding:8px 24px 24px;display:flex;flex-direction:column}
.tabs{display:flex;gap:4px;margin-bottom:16px}
.tabs span{padding:5px 10px;border-radius:7px;color:var(--muted-fg);font-size:13px;cursor:pointer}.tabs span.on{background:var(--acc);color:var(--fg)}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:8px}
.row:hover{background:var(--muted)}
.row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{color:var(--muted-fg);font-size:13px}
.grp{font-size:12px;color:var(--muted-fg);padding:16px 8px 4px;display:flex;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;background:var(--acc);font-size:12px;color:var(--muted-fg)}
.dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted-fg)}.dot.p{border-color:#f59e0b}.dot.d{background:var(--ok);border-color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:var(--muted);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card .h{display:flex;align-items:center;gap:10px;font-weight:500}
.card p{color:var(--muted-fg);font-size:13px;line-height:1.45}
.center{max-width:720px;width:100%;margin:0 auto}
.hello{font-size:28px;font-weight:500;letter-spacing:-.02em;text-align:center;margin:96px 0 24px;display:flex;align-items:center;justify-content:center;gap:12px}
.hello .cr{width:36px;height:36px}
.comp{background:var(--muted);border-radius:16px;padding:12px 12px 10px}
.comp .ph{color:var(--muted-fg);padding:4px 4px 14px;font-size:15px}
.comp .ctl{display:flex;align-items:center;gap:6px}
.comp .ctl .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.mic{width:32px;height:32px;border-radius:50%;background:var(--border);color:var(--fg);display:grid;place-items:center}
.hint{text-align:center;color:var(--muted-fg);font-size:12px;margin-top:10px}
kbd{font-family:'Geist Mono',monospace;font-size:11px;background:var(--acc);border-radius:5px;padding:2px 6px;color:var(--fg)}
.split{display:flex;flex:1;min-height:0;margin:0 -24px -24px}
.list{width:300px;padding:0 12px;overflow:auto;flex:none}
.thread{flex:1;display:flex;flex-direction:column;min-width:0;padding:0 24px 16px}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:18px;padding:8px 0 16px}
.um{align-self:flex-end;max-width:70%;background:var(--muted);border-radius:14px;padding:10px 14px;line-height:1.5}
.um .src{display:flex;align-items:center;gap:4px;color:var(--muted-fg);font-size:12px;margin-bottom:4px}
.am{display:flex;gap:10px;line-height:1.55}
.am .who{font-weight:500;font-size:13px;margin-bottom:4px}.am .who span{color:var(--muted-fg);font-weight:400;margin-left:6px}
.trace{display:flex;flex-direction:column;gap:6px;margin:4px 0 8px;color:var(--muted-fg);font-size:13px}
.trace div{display:flex;align-items:center;gap:.4em}.trace svg.o{width:.5em*1;width:7px;height:7px}
.appr{border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:8px;display:flex;align-items:center;gap:12px}
.appr .t{flex:1}.appr .t small{display:block;color:var(--muted-fg);font-size:12px}
.rs{width:320px;flex:none;background:var(--side);padding:12px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.screen{aspect-ratio:16/10;border-radius:10px;background:linear-gradient(135deg,#cfd6df,#9aa6b5);position:relative;overflow:hidden}
.screen .w{position:absolute;left:12%;top:14%;width:62%;height:62%;background:#fff;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.screen .w:before{content:'';position:absolute;left:8px;top:7px;width:30px;height:6px;border-radius:3px;background:#e5e5e5}
.screen .cur{position:absolute;left:52%;top:48%;width:10px;height:10px;border-radius:50%;background:#3b82f6;box-shadow:0 0 0 6px rgba(59,130,246,.25)}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:6px 0}.kv span:first-child{color:var(--muted-fg)}
.set{display:flex;flex:1;min-height:0;margin:0 -24px -24px}
.snav{width:220px;padding:0 12px;overflow:auto;flex:none}
.snav a{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;height:32px;cursor:pointer}
.snav a:hover{background:var(--muted)}.snav a.on{background:var(--acc);font-weight:500}
.snav .lbl{font-size:12px;color:var(--muted-fg);padding:14px 8px 6px}
.spage{flex:1;overflow:auto;padding:0 32px 32px}.spage>*{max-width:680px}
.spage h1{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:4px 0 20px}
.sg{margin-bottom:24px}.sg h2{font-size:13px;font-weight:500;color:var(--muted-fg);margin-bottom:8px}
.sbox{background:var(--muted);border-radius:12px}
.srow{display:flex;align-items:center;gap:16px;padding:12px 16px;min-height:56px}
.srow+.srow{box-shadow:0 -1px 0 var(--border)}
.srow .t{flex:1}.srow .t small{display:block;color:var(--muted-fg);font-size:12px;margin-top:2px}
.sw{width:32px;height:18px;border-radius:9px;background:var(--border);position:relative;flex:none}
.sw:after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.15s}
.sw.on{background:var(--fg)}.sw.on:after{left:16px;background:var(--bg)}
.sel{height:32px;padding:0 10px;border-radius:8px;background:var(--bg);display:inline-flex;align-items:center;gap:6px;font-size:13px;box-shadow:0 0 0 1px var(--border)}
.wall{width:1280px;height:800px;border-radius:12px;background:linear-gradient(160deg,#c8d0db,#8e9aab);position:relative;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.25)}
[data-theme=dark] .wall{background:linear-gradient(160deg,#2a3039,#111418)}
.mac{position:absolute;inset:0 0 auto 0;height:26px;background:rgba(255,255,255,.35);backdrop-filter:blur(20px);display:flex;align-items:center;padding:0 16px;gap:18px;font-size:13px;font-weight:500;color:#111}
.mail{position:absolute;left:90px;top:70px;width:620px;height:420px;background:#fff;border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.25);padding:44px 28px;color:#111;line-height:1.6}
.mail .sel-t{background:#bfdbfe}
.pills{position:absolute;right:48px;top:70px;display:flex;flex-direction:column;gap:18px;width:460px}
.pl{font-size:12px;color:rgba(0,0,0,.55);margin-bottom:6px}[data-theme=dark] .pl{color:rgba(255,255,255,.6)}
.pill{background:rgba(23,23,23,.92);color:#fafafa;border-radius:999px;height:44px;display:inline-flex;align-items:center;gap:10px;padding:0 16px 0 12px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:13px}
.pill .cr{width:22px;height:22px}
.wave{display:flex;gap:3px;align-items:center;height:18px}.wave i{width:3px;border-radius:2px;background:#fafafa;animation:w 1s ease-in-out infinite}
@keyframes w{0%,100%{height:4px}50%{height:18px}}
.dots{display:flex;gap:4px}.dots i{width:5px;height:5px;border-radius:50%;background:#a3a3a3;animation:b 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes b{0%,100%{opacity:.3}50%{opacity:1}}
.pcard{background:rgba(23,23,23,.94);color:#fafafa;border-radius:18px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:13px;line-height:1.5}
.pcard .hd{display:flex;align-items:center;gap:8px;color:#a3a3a3;font-size:12px;margin-bottom:8px}
.pcard .ac{display:flex;gap:6px;margin-top:12px}
.pcard .ac button{height:28px;padding:0 10px;border-radius:7px;background:#262626;font-size:12px;font-weight:500}
.pcard .ac button.p{background:#404040}
.permc{display:flex;align-items:center;gap:12px;background:var(--muted);border-radius:12px;padding:12px 14px;margin-top:8px}
.permc .t{flex:1}.permc small{display:block;color:var(--muted-fg);font-size:12px}
.browser{flex:1;border-radius:12px;background:var(--muted);display:flex;flex-direction:column;overflow:hidden}
.url{display:flex;align-items:center;gap:8px;padding:8px}.url .u{flex:1;height:32px;border-radius:8px;background:var(--bg);display:flex;align-items:center;padding:0 12px;color:var(--muted-fg);font-size:13px}
.page{flex:1;margin:0 8px 8px;border-radius:8px;background:var(--bg);display:grid;place-items:center;color:var(--muted-fg)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.board .col{background:var(--muted);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:300px}
.board .col .ch{font-size:12px;color:var(--muted-fg);padding:4px 6px}
.board .it{background:var(--bg);border-radius:8px;padding:10px;font-size:13px;display:flex;flex-direction:column;gap:8px}
</style>
</head>

V.settings=()=>{const it=s=>`<a class="${S.set===s[0]?'on':''}" data-s="${s[0]}">${ic(s[2])}${s[1]}</a>`;
 return `<div class="set"><div class="snav">${SET.filter(s=>!s[3]).map(it).join('')}<div class="lbl">This Mac</div>${SET.filter(s=>s[3]).map(it).join('')}</div>
 <div class="spage"><h1>${SET.find(s=>s[0]===S.set)[1]}</h1>${SP[S.set]()}</div></div>`;};

 return `<div class="wall"><div class="mac"><b></b><span>Mail</span><span style="font-weight:400">File</span><span style="font-weight:400">Edit</span><span style="margin-left:auto;display:flex;gap:10px;align-items:center">${ORB_SVG.replace('<svg ','<svg style="width:12px;height:12px" ')}9:41 PM</span></div>
 <div class="mail"><b>Alex Chen</b><div style="color:#737373;font-size:13px;margin-bottom:16px">Re: Q4 review</div><span class="sel-t">Could we move the review to Thursday? Also, can you send the deck before then?</span><br><br>Thanks,<br>Alex</div>
 <div class="pills">
 <div><div class="pl">Listening</div><span class="pill">${ov()}${wv}<span style="color:#a3a3a3">Mail · selection</span></span></div>
 <div><div class="pl">Thinking</div><span class="pill">${ov()}<span class="dots"><i></i><i></i><i></i></span></span></div>
 <div><div class="pl">Approval</div><div class="pcard"><div class="hd">${ov()}Overlay</div>Send this reply to Alex Chen with Q4 deck.pdf?<div class="ac"><button class="p">Send</button><button>Edit</button><button>Open in Overlay</button></div></div></div>
 <div><div class="pl">Answer</div><div class="pcard"><div class="hd">${ov()}Overlay</div>Sent. I also added Thursday 2 PM to your calendar.<div class="ac"><button>Undo</button><button>Open in Overlay</button></div></div></div>
 </div></div>`;}

function render(){
 document.getElementById('bar').innerHTML=[['app','App'],['pill','Voice pill'],['onboarding','Onboarding']].map(([m,l])=>`<button class="${S.mode===m?'on':''}" data-m="${m}">${l}</button>`).join('')+`<button data-t="1">${ic('moon')}</button>`;
 const st=document.getElementById('stage');
 if(S.mode==='pill'){st.innerHTML=pills();return;}
 const view=S.mode==='onboarding'?'onboarding':S.view;
 const saved=S.view;S.view=view;
 st.innerHTML=`<div class="win">${sidebar()}<main class="main">${topbar()}<div class="body">${V[view]()}</div></main></div>`;
 S.view=saved;
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-v],[data-m],[data-t],[data-s],[data-w],[data-x],[data-c],[data-ag],[data-r],[data-a],[data-ch]');if(!t)return;e.preventDefault();e.stopPropagation();const d=t.dataset;
 if(d.v){S.view=d.v;S.mode='app';if(d.v==='agents')S.agent=null;}
 if(d.m)S.mode=d.m; if(d.t)document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
 if(d.s)S.set=d.s; if(d.w)S.wtab=d.w; if(d.x)S.xtab=d.x; if(d.c)S.ctab=d.c; if(d.ag)S.agent=d.ag; if(d.r)S.rtab=d.r; if(d.a==='rs')S.rs=S.rs===false?true:false; if(d.ch)S.chat=+d.ch;
 render();});
const h=location.hash.slice(1);if(h){const [a,b]=h.split('/');if(a==='pill'||a==='onboarding')S.mode=a;else{S.view=a;if(b){if(a==='settings')S.set=b;if(a==='agents')S.agent=decodeURIComponent(b);}}}
render();
</script>
