<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overlay | Thread footer preview</title>
  <style>
    /* App mockup: use Overlay's palette instead of a report-kit skin. */
    :root { color-scheme: light; --background:#fafafa; --foreground:#0a0a0a; --muted:#71717a; --border:#e4e4e7; --elevated:#ffffff; --subtle:#f0f0f0; --control:#eaeaed; --hover:#dedee4; }
    [data-theme="dark"] { color-scheme:dark; --background:#09090b; --foreground:#f5f5f5; --muted:#a1a1aa; --border:#27272a; --elevated:#111113; --subtle:#1c1c20; --control:#252529; --hover:#303036; }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; padding:32px; background:var(--elevated); color:var(--foreground); font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button, select, textarea { font:inherit; color:inherit; }
    button, select { border:1px solid var(--border); border-radius:8px; background:var(--background); min-height:32px; padding:5px 12px; cursor:pointer; }
    button:hover, select:hover { background:var(--subtle); }
    button:focus-visible, select:focus-visible, textarea:focus-visible { outline:2px solid var(--muted); outline-offset:3px; }
    button:disabled { opacity:.5; cursor:default; }
    h1, h2, p { margin:0; }
    h1 { font-size:18px; font-weight:600; letter-spacing:-.3px; }
    h2 { font-size:14px; font-weight:500; }
    .page { max-width:1184px; margin:0 auto; }
    .intro { display:flex; justify-content:space-between; gap:16px; align-items:center; margin-bottom:24px; }
    .intro p { color:var(--muted); font-size:12px; margin-top:4px; }
    .controls { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:16px; }
    .segmented { display:flex; padding:3px; gap:2px; border:1px solid var(--border); border-radius:10px; }
    .segmented button { border-color:transparent; background:transparent; font-size:12px; min-height:28px; padding:4px 12px; }
    .segmented button[aria-pressed="true"] { background:var(--control); }
    .controls label { display:flex; gap:8px; align-items:center; color:var(--muted); font-size:12px; }
    .controls select { color:var(--foreground); font-size:12px; max-width:100%; }
    .reset { margin-left:auto; color:var(--muted); font-size:12px; }
    .frame { display:flex; height:clamp(420px,calc(100dvh - 240px),560px); border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--background); }
    .pane { display:flex; flex-direction:column; min-width:0; flex:1; }
    .pane > header { height:56px; flex-shrink:0; border-bottom:1px solid var(--border); padding:0 24px; display:flex; align-items:center; gap:10px; }
    .breadcrumb { color:var(--muted); font-size:12px; }
    .separator { color:var(--muted); }
    .thread { flex:0 0 380px; border-left:1px solid var(--border); }
    .thread > header { padding:0 20px; }
    .history { flex:1; min-height:0; overflow:auto; padding:40px 24px; }
    .messages { max-width:640px; margin:auto; display:flex; flex-direction:column; gap:30px; }
    .thread .history { padding:28px 20px; }
    .user { align-self:flex-end; padding:10px 16px; border-radius:18px; background:var(--subtle); max-width:90%; }
    .assistant { display:flex; flex-direction:column; gap:16px; }
    .work { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; }
    .work svg { width:14px; height:14px; flex-shrink:0; }
    .footer { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:12px; padding:16px; flex-shrink:0; }
    .notice { text-align:center; font-size:12px; line-height:18px; color:var(--muted); }
    .footer button { height:32px; border-radius:6px; background:transparent; font-size:12px; font-weight:500; flex-shrink:0; }
    .footer button:hover { background:var(--subtle); }
    .composer { margin:12px 20px 20px; border:1px solid var(--border); border-radius:14px; padding:12px; background:var(--elevated); }
    .composer textarea { display:block; resize:none; width:100%; min-height:52px; background:transparent; border:0; padding:4px; }
    .composer textarea::placeholder { color:var(--muted); }
    .composer-tools { display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
    .composer-tools span { font-size:12px; color:var(--muted); }
    .composer-tools button { background:var(--control); }
    .empty { display:grid; place-content:center; height:100%; color:var(--muted); font-size:14px; }
    .caption { min-height:36px; margin-top:12px; font-size:12px; color:var(--muted); }
    @media (max-width:820px) { body { padding:20px; } .thread { flex-basis:330px; } .pane > header { padding:0 16px; } .history { padding:28px 16px; } }
    @media (max-width:640px) { body { padding:16px; } .intro { align-items:flex-start; } .intro p { max-width:230px; } .controls { gap:10px; } .reset { margin-left:0; } .frame { height:550px; } .frame.channel { height:auto; flex-direction:column; } .frame.channel .pane { flex:none; height:380px; } .frame.channel .thread { border-left:0; border-top:1px solid var(--border); height:480px; } .footer { gap:12px; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="intro">
      <div><h1>Thread footer</h1><p>Design preview with sample history. No live requests.</p></div>
      <button id="theme" type="button">Light theme</button>
    </div>
    <div class="controls" aria-label="Preview controls">
      <div class="segmented" role="group" aria-label="Conversation layout">
        <button type="button" id="personal" aria-pressed="true">Personal thread</button>
        <button type="button" id="channel" aria-pressed="false">Channel reply</button>
      </div>
      <label>State
        <select id="state">
          <option value="retired">Retired</option>
          <option value="unavailable">Temporarily unavailable</option>
          <option value="checking">Checking</option>
          <option value="error">Check failed</option>
        </select>
      </label>
      <button type="button" id="reset" class="reset">Reset preview</button>
    </div>
    <section class="frame" id="frame" aria-label="Conversation preview">
      <section class="pane" aria-labelledby="main-title">
        <header><span class="breadcrumb" id="section-label">Chats</span><span class="separator">/</span><h2 id="main-title">Video Agent</h2></header>
        <div class="history" id="main-history"></div>
        <div class="footer" id="main-footer"><p class="notice" role="status"></p><button type="button"></button></div>
        <form class="composer" id="main-composer" hidden>
          <textarea aria-label="Message draft" placeholder="Message Video Agent…"></textarea>
          <div class="composer-tools"><span>Draft only</span><button type="submit">Send</button></div>
        </form>
      </section>
      <section class="pane thread" id="thread" aria-labelledby="thread-title" hidden>
        <header><h2 id="thread-title">Thread</h2></header>
        <div class="history" id="thread-history"></div>
        <div class="footer" id="thread-footer"><p class="notice" role="status"></p><button type="button"></button></div>
        <form class="composer" id="thread-composer" hidden>
          <textarea aria-label="Reply draft" placeholder="Reply to thread…"></textarea>
          <div class="composer-tools"><span>Draft only</span><button type="submit">Send</button></div>
        </form>
      </section>
    </section>
    <p class="caption" id="caption" role="status"></p>
  </main>
  <template id="history-template">
    <div class="messages">
      <p class="user">Create the launch video.</p>
      <div class="assistant">
        <p>The script is ready. Next is the render.</p>
        <div class="work"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>Prepare project files</div>
      </div>
    </div>
  </template>
  <script>
    const $ = (id) => document.getElementById(id);
    const notices = {
      retired: 'The harness has changed. Start a new thread to continue.',
      unavailable: 'Thread safety checks are temporarily unavailable. Your history is preserved. Please try again shortly.',
      checking: 'Checking thread safety…',
      error: 'Could not check this thread. Please try again.',
    };
    let layout = 'personal';
    let timer;
    function fillHistory(id) {
      $(id).replaceChildren($('history-template').content.cloneNode(true));
    }
    function showFooter(id, state) {
      const footer = $(id);
      footer.querySelector('p').textContent = notices[state];
      const button = footer.querySelector('button');
      button.hidden = state === 'checking';
      button.textContent = state === 'retired' ? 'New thread' : 'Retry';
    }
    function render() {
      clearTimeout(timer);
      const channel = layout === 'channel';
      $('frame').classList.toggle('channel', channel);
      $('personal').setAttribute('aria-pressed', String(!channel));
      $('channel').setAttribute('aria-pressed', String(channel));
      $('section-label').textContent = channel ? 'Channels' : 'Chats';
      $('main-title').textContent = channel ? 'Launch' : 'Video Agent';
      $('thread').hidden = !channel;
      $('main-footer').hidden = channel;
      $('main-composer').hidden = !channel;
      $('thread-footer').hidden = false;
      $('thread-composer').hidden = true;
      for (const id of ['main-history', 'thread-history']) fillHistory(id);
      for (const id of ['main-footer', 'thread-footer']) showFooter(id, $('state').value);
      document.querySelectorAll('textarea').forEach((el) => { el.value = ''; });
      $('main-composer').querySelector('textarea').placeholder = channel ? 'Message Launch…' : 'Message Video Agent…';
      $('caption').textContent = channel ? 'Only this reply thread is locked. The channel composer stays available.' : 'History stays readable. The footer replaces the composer, including for an old run still marked as active.';
    }
    function act() {
      const channel = layout === 'channel';
      if ($('state').value === 'retired') {
        if (channel) {
          $('thread').hidden = true;
          $('frame').classList.remove('channel');
        } else {
          $('main-title').textContent = 'New thread';
          const empty = document.createElement('p');
          empty.className = 'empty';
          empty.textContent = 'A fresh thread';
          $('main-history').replaceChildren(empty);
          $('main-footer').hidden = true;
          $('main-composer').hidden = false;
        }
        const draft = $('main-composer').querySelector('textarea');
        draft.value = 'Continue the launch video. Previous thread: script ready; render pending.';
        draft.focus();
        $('caption').textContent = 'Preview: fresh context with an editable handoff draft. Nothing has been sent; the old history is unchanged.';
        return;
      }
      const target = channel ? 'thread' : 'main';
      showFooter(target + '-footer', 'checking');
      $('caption').textContent = 'Preview: retrying the safety check. History is unchanged.';
      timer = setTimeout(() => {
        $(target + '-footer').hidden = true;
        $(target + '-composer').hidden = false;
        $(target + '-composer').querySelector('textarea').focus();
        $('caption').textContent = 'Preview: the safety check succeeded, so the same thread is writable again.';
      }, 900);
    }
    $('personal').onclick = () => { layout = 'personal'; render(); };
    $('channel').onclick = () => { layout = 'channel'; render(); };
    $('state').onchange = render;
    $('reset').onclick = render;
    $('theme').onclick = () => {
      const dark = document.documentElement.dataset.theme !== 'dark';
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      $('theme').textContent = dark ? 'Light theme' : 'Dark theme';
    };
    document.querySelectorAll('.footer button').forEach((button) => { button.onclick = act; });
    document.querySelectorAll('form').forEach((form) => {
      form.onsubmit = (event) => { event.preventDefault(); $('caption').textContent = 'Preview only. No message was sent.'; };
    });
    render();
  </script>
</body>
</html>
