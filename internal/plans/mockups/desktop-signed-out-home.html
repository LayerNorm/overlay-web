<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desktop Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Tokens copied from packages/overlay-ui/src/styles.css */
:root{
  --background:#fafafa;--foreground:#0a0a0a;--muted:#71717a;--muted-light:#a1a1aa;--border:#e4e4e7;
  --btn-primary-bg:#dcdce1;--btn-primary-hover:#ccccd3;--btn-primary-text:#27272a;
  --btn-secondary-bg:#eaeaed;--btn-secondary-hover:#dedee4;--btn-secondary-text:#27272a;
  --desk:#e9e9ec;--chrome-shadow:0 30px 80px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.08);
  --bar-bg:rgba(255,255,255,.85);
}
:root[data-theme="dark"]{
  --background:#09090b;--foreground:#f5f5f5;--muted:#a1a1aa;--muted-light:#71717a;--border:#27272a;
  --btn-primary-bg:#3b3b42;--btn-primary-hover:#484850;--btn-primary-text:#ededf0;
  --btn-secondary-bg:#252529;--btn-secondary-hover:#303036;--btn-secondary-text:#ededf0;
  --desk:#1a1a1d;--chrome-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);
  --bar-bg:rgba(24,24,27,.85);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--desk);color:var(--foreground);font-family:Geist,ui-sans-serif,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:32px 16px 96px}

/* The Mac window (context only, not part of the design) */
.window{position:relative;width:min(980px,100%);height:min(640px,calc(100vh - 140px));min-height:460px;
  background:var(--background);border-radius:12px;box-shadow:var(--chrome-shadow);overflow:hidden}
.lights{position:absolute;top:14px;left:14px;display:flex;gap:8px}
.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57}
.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}

/* The proposed screen */
.home{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px}
.lockup{height:40px;width:auto;color:var(--foreground);display:block}
.tagline{margin-top:30px;font-size:14px;line-height:21px;color:var(--muted);text-align:center;min-height:21px}
.actions{margin-top:28px;width:260px;display:flex;flex-direction:column;gap:8px}
.btn{appearance:none;border:0;height:36px;border-radius:8px;font:500 14px/1 Geist,system-ui,sans-serif;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background-color .15s ease}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.primary{background:var(--btn-primary-bg);color:var(--btn-primary-text)}
.primary:hover{background:var(--btn-primary-hover)}
.secondary{background:var(--btn-secondary-bg);color:var(--btn-secondary-text)}
.secondary:hover{background:var(--btn-secondary-hover)}
.ghost{background:transparent;color:var(--muted);height:32px;font-weight:400}
.ghost:hover{color:var(--foreground)}
.note{margin-top:16px;font-size:12px;line-height:18px;color:var(--muted-light);text-align:center}
.alt{position:absolute;bottom:44px;left:0;right:0;text-align:center;font-size:13px;color:var(--muted)}
.link{appearance:none;border:0;background:none;padding:0;font:500 13px Geist,system-ui,sans-serif;color:var(--foreground);cursor:pointer}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.foot{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:12px;color:var(--muted-light)}
.foot a{color:inherit;text-decoration:none}.foot a:hover{color:var(--muted)}
.state{display:none}.state.on{display:contents}
.enter{animation:enter .4s ease-out both}
@keyframes enter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.enter,.spin{animation:none}}

/* Mockup controls */
.bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:4px;padding:4px;border-radius:10px;
  background:var(--bar-bg);backdrop-filter:blur(12px);box-shadow:0 0 0 1px var(--border),0 8px 24px rgba(0,0,0,.08);
  font-size:12px;max-width:calc(100vw - 32px);overflow-x:auto}
.bar button{appearance:none;border:0;background:transparent;color:var(--muted);font:500 12px Geist,system-ui;padding:7px 10px;border-radius:7px;cursor:pointer;white-space:nowrap}
.bar button[aria-pressed="true"]{background:var(--btn-secondary-bg);color:var(--foreground)}
.bar hr{border:0;width:1px;background:var(--border);margin:4px 2px}
</style>
</head>

    <!-- Signed out (also first launch): the boot screen settles into two choices -->
    <div class="state on" data-state="signed-out">
      <p class="tagline">Your AI Chief of Staff.</p>
      <div class="actions enter">
        <button class="btn primary" data-go="waiting">Sign in</button>
      </div>
      <p class="note enter">Opens in your browser, then brings you back here.</p>
      <p class="alt enter">New to Overlay? <button class="link" data-go="waiting">Create an account</button></p>
    </div>
    <!-- After Sign in: the browser is open; the app waits for overlay:// -->
    <div class="state" data-state="waiting">
      <p class="tagline" style="display:flex;align-items:center;gap:8px">
        <svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        Finish signing in in your browser&hellip;
      </p>
      <div class="actions enter">
        <button class="btn secondary">
          <svg viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
          Open browser again
        </button>
        <button class="btn ghost" data-go="signed-out">Cancel</button>
      </div>
    </div>
    <!-- Coming back: the same screen the app shows while loading -->
    <div class="state" data-state="opening">
      <p class="tagline" style="display:flex;align-items:center;gap:8px">
        <svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        Opening Workspace&hellip;
      </p>
    </div>
  </main>
  <footer class="foot"><a href="#">Overlay 0.3.1</a> &middot; <a href="#">Help</a></footer>
</div>

<nav class="bar" aria-label="Mockup controls">
  <button data-set="signed-out" aria-pressed="true">Signed out</button>
  <button data-set="waiting" aria-pressed="false">Waiting for browser</button>
  <button data-set="opening" aria-pressed="false">Signed in</button>
  <hr>
  <button data-theme-toggle aria-pressed="false">Dark</button>
</nav>

<script>
const show = (name) => {
  document.querySelectorAll('[data-state]').forEach((el) => {
    el.classList.toggle('on', el.dataset.state === name)
    el.querySelectorAll('.enter').forEach((e) => { e.style.animation = 'none'; void e.offsetWidth; e.style.animation = '' })
  })
  document.querySelectorAll('[data-set]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.set === name)))
  try { history.replaceState(null, '', '#' + name) } catch {}
}
document.addEventListener('click', (e) => {
  const go = e.target.closest('[data-go],[data-set]')
  if (go) show(go.dataset.go || go.dataset.set)
  const t = e.target.closest('[data-theme-toggle]')
  if (t) {
    const dark = document.documentElement.dataset.theme !== 'dark'
    document.documentElement.dataset.theme = dark ? 'dark' : 'light'
    t.setAttribute('aria-pressed', String(dark))
  }
})
const params = new URLSearchParams(location.search)
if (params.get('theme') === 'dark') { document.documentElement.dataset.theme = 'dark'; document.querySelector('[data-theme-toggle]').setAttribute('aria-pressed','true') }
if (location.hash.slice(1)) show(location.hash.slice(1))
</script>
</body>
</html>
