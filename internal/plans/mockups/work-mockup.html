<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Overlay — Work mockup</title>
<script>
  /* theme: saved choice, else the system setting (set before first paint to avoid a flash) */
  (function () {
    var t = null
    try { t = localStorage.getItem('overlay-mockup-theme') } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
    document.documentElement.dataset.theme = t
  })()
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<style>
  /* Tokens copied from src/app/globals.css so the mockup sits in the real app chrome. */
  :root {
    --background: #fafafa;
    --foreground: #0a0a0a;
    --muted: #71717a;
    --muted-light: #a1a1aa;
    --border: #e4e4e7;
    --surface-elevated: #ffffff;
    --surface-muted: #f5f5f5;
    --surface-subtle: #f0f0f0;
    --sidebar-surface: #f5f5f5;
    --button-primary-bg: #0a0a0a;
    --button-primary-text: #ffffff;
    --scrollbar-thumb: #d4d4d8;
    --shadow-pop: 0 18px 50px -18px rgba(0,0,0,.28), 0 2px 8px rgba(0,0,0,.06);

    --s-backlog: #a1a1aa;
    --s-todo: #71717a;
    --s-progress: #d97706;
    --s-review: #7c3aed;
    --s-done: #16a34a;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --serif: 'Libre Baskerville', Georgia, serif;
    --sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
  }
  :root[data-theme="dark"] {
    --background: #09090b;
    --foreground: #f5f5f5;
    --muted: #a1a1aa;
    --muted-light: #71717a;
    --border: #27272a;
    --surface-elevated: #111113;
    --surface-muted: #151518;
    --surface-subtle: #1c1c20;
    --sidebar-surface: #111113;
    --button-primary-bg: #f5f5f5;
    --button-primary-text: #09090b;
    --scrollbar-thumb: #3f3f46;
    --shadow-pop: 0 18px 50px -18px rgba(0,0,0,.8), 0 2px 8px rgba(0,0,0,.4);
    --s-progress: #fbbf24;
    --s-review: #a78bfa;
    --s-done: #4ade80;
    --danger: #f87171;
    --danger-bg: rgba(127, 29, 29, 0.4);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--background); color: var(--foreground);
    font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  input { font: inherit; color: inherit; }
  svg.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 8px; }

  .app { display: flex; height: 100vh; }

  /* ---------- primary rail ---------- */
  .rail { width: 224px; flex: none; background: var(--sidebar-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .rail-head, .panel-head { height: 64px; flex: none; display: flex; align-items: center; border-bottom: 1px solid var(--border); padding: 0 16px; }
  .lockup { display: inline-flex; align-items: center; gap: 10px; font: 400 19px var(--serif); letter-spacing: -0.02em; line-height: 1; text-transform: lowercase; }
  .orb { width: 10px; height: 10px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 34% 28%, #ffffff 0%, #c9c9cf 38%, #6b6b73 78%, #3a3a40 100%);
    box-shadow: 0 0 0 .5px rgba(0,0,0,.25), 0 1px 2px rgba(0,0,0,.25); }
  .rail-nav { flex: 1; padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; }
  .rail-btn { height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 6px; color: var(--muted); text-align: left; transition: background .15s, color .15s; }
  .rail-btn:hover { background: var(--surface-subtle); color: var(--foreground); }
  .rail-btn.on { background: var(--surface-subtle); color: var(--foreground); }
  .rail-foot { padding: 12px 8px; border-top: 1px solid var(--border); }
  .rail-foot .me { display: flex; align-items: center; gap: 10px; padding: 6px 12px; color: var(--muted); font-size: 13px; }

  /* ---------- secondary panel ---------- */
  .panel2 { width: 232px; flex: none; background: var(--sidebar-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .panel-title { font: 500 18px var(--serif); letter-spacing: -0.01em; text-transform: lowercase; }
  .panel-nav { padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; }
  .scope-btn { height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 6px; color: var(--muted); transition: background .15s, color .15s; }
  .scope-btn:hover { background: var(--surface-subtle); color: var(--foreground); }
  .scope-btn.on { color: var(--foreground); }
  .scope-btn .ct { margin-left: auto; font-size: 11px; color: var(--muted-light); }
  .kids { display: flex; flex-direction: column; gap: 1px; margin: 2px 0 6px 21px; padding-left: 8px; border-left: 1px solid var(--border); }
  .kid { height: 32px; display: flex; align-items: center; gap: 9px; padding: 0 10px; border-radius: 6px; color: var(--muted); font-size: 13px; transition: background .15s, color .15s; }
  .kid:hover { background: var(--surface-subtle); color: var(--foreground); }
  .kid.on { background: var(--surface-subtle); color: var(--foreground); }
  .panel-sec { padding: 14px 20px 0; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-light); }
  .mini-list { padding: 6px 8px; display: flex; flex-direction: column; gap: 1px; }
  .mini { display: flex; align-items: center; gap: 9px; padding: 6px 12px; border-radius: 6px; color: var(--muted); font-size: 13px; cursor: pointer; }
  .mini:hover { background: var(--surface-subtle); color: var(--foreground); }
  .mini .n { margin-left: auto; font-size: 11px; color: var(--muted-light); }

  /* ---------- main ---------- */
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  .top { height: 64px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 24px; border-bottom: 1px solid var(--border); }
  .top h1 { margin: 0; font: 400 18px var(--serif); letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
  .top h1 span { color: var(--muted-light); }
  .grow { flex: 1; }
  .search { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; width: 220px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-elevated); color: var(--muted-light); }
  .search input { border: 0; outline: 0; background: none; width: 100%; font-size: 13px; color: var(--foreground); }
  .btn { height: 34px; display: inline-flex; align-items: center; gap: 7px; padding: 0 14px; border-radius: 8px; font-size: 13px; font-weight: 500; transition: opacity .15s, background .15s; }
  .btn.primary { background: var(--button-primary-bg); color: var(--button-primary-text); }
  .btn.primary:hover { opacity: .88; }
  .btn.ghost { border: 1px solid var(--border); background: var(--surface-elevated); color: var(--foreground); }
  .btn.ghost:hover { background: var(--surface-subtle); }
  .btn.sm { height: 30px; padding: 0 12px; }
  kbd { font: 10.5px var(--mono); padding: 1px 5px; border: 1px solid var(--border); border-radius: 4px; color: var(--muted); background: var(--surface-muted); }

  .filters { display: flex; align-items: center; gap: 6px; padding: 12px 24px; border-bottom: 1px solid var(--border); flex: none; }
  .chip { height: 28px; display: inline-flex; align-items: center; gap: 7px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--border); font-size: 12.5px; color: var(--muted); background: transparent; transition: all .15s; }
  .chip:hover { color: var(--foreground); background: var(--surface-subtle); }
  .chip.on { background: var(--surface-subtle); color: var(--foreground); border-color: var(--muted-light); }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--s-review); }
  .chip .dot.red { background: var(--danger); }

  .view { flex: 1; min-height: 0; overflow: auto; }

  /* ---------- status + avatars ---------- */
  .st { width: 16px; height: 16px; flex: none; display: block; }
  .av { width: 22px; height: 22px; flex: none; display: inline-grid; place-items: center; font-size: 10px; font-weight: 600; color: var(--foreground); background: var(--surface-subtle); border: 1px solid var(--border); border-radius: 50%; }
  .av.agent { border-radius: 7px; color: #fff; border: 0; background: var(--ac, #52525b); }
  .av.lg { width: 26px; height: 26px; font-size: 11px; }
  .av.none { background: transparent; border: 1px dashed var(--muted-light); color: var(--muted-light); }
  .pri { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 12px; }
  .pri i { width: 3px; border-radius: 1px; background: var(--border); }
  .pri i:nth-child(1) { height: 5px; } .pri i:nth-child(2) { height: 8px; } .pri i:nth-child(3) { height: 12px; }
  .pri[data-p="1"] i:nth-child(-n+1), .pri[data-p="2"] i:nth-child(-n+2), .pri[data-p="3"] i:nth-child(-n+3) { background: var(--muted); }
  .pri[data-p="3"] i { background: var(--foreground); }
  .tag { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 5px; font-size: 11.5px; color: var(--muted); background: var(--surface-subtle); white-space: nowrap; }
  .tag.attn { color: var(--s-review); background: color-mix(in srgb, var(--s-review) 12%, transparent); }
  .tag.block { color: var(--danger); background: var(--danger-bg); }
  .tag svg.i { width: 11px; height: 11px; }
  .key { font: 11.5px var(--mono); color: var(--muted-light); width: 58px; flex: none; }

  /* ---------- list view ---------- */
  .quick { display: flex; align-items: center; gap: 12px; margin: 14px 24px 4px; padding: 0 14px; height: 40px; border: 1px dashed var(--border); border-radius: 10px; color: var(--muted-light); transition: border-color .15s, background .15s; }
  .quick:focus-within { border-style: solid; border-color: var(--muted-light); background: var(--surface-elevated); color: var(--foreground); }
  .quick input { flex: 1; border: 0; outline: 0; background: none; font-size: 14px; }
  .group-h { display: flex; align-items: center; gap: 9px; padding: 20px 24px 6px; font-size: 13px; font-weight: 500; cursor: pointer; user-select: none; }
  .group-h .n { color: var(--muted-light); font-weight: 400; }
  .group-h .chev { color: var(--muted-light); transition: transform .15s; }
  .group.closed .group-h .chev { transform: rotate(-90deg); }
  .group.closed .rows { display: none; }
  .row { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 24px; border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); cursor: pointer; transition: background .12s; }
  .row:hover { background: var(--surface-muted); }
  .row.sel { background: var(--surface-subtle); }
  .row .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.done .title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--muted-light); }
  .row .meta { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 12.5px; }
  .row .due { width: 54px; text-align: right; color: var(--muted-light); }
  .row .due.soon { color: var(--s-progress); }
  .row .parent { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- board ---------- */
  .board { display: flex; gap: 14px; padding: 18px 24px 24px; height: 100%; min-width: min-content; }
  .col { flex: 1 0 236px; max-width: 340px; display: flex; flex-direction: column; min-height: 0; border-radius: 12px; }
  .col-h { display: flex; align-items: center; gap: 9px; padding: 0 6px 10px; font-size: 13px; font-weight: 500; }
  .col-h .n { color: var(--muted-light); font-weight: 400; }
  .col-b { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 2px 2px 20px; border-radius: 12px; transition: background .15s; }
  .col.over .col-b { background: var(--surface-subtle); }
  .card { background: var(--surface-elevated); border: 1px solid var(--border); border-radius: 10px; padding: 12px 12px 11px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; transition: border-color .15s, box-shadow .15s, opacity .15s; }
  .card:hover { border-color: var(--muted-light); }
  .card.dragging { opacity: .35; }
  .card .t { line-height: 1.4; }
  .card .foot { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .card .foot .sp { flex: 1; }
  .card .k { font: 11px var(--mono); color: var(--muted-light); }
  .empty { border: 1px dashed var(--border); border-radius: 10px; padding: 18px; text-align: center; color: var(--muted-light); font-size: 12.5px; }

  /* ---------- timeline ---------- */
  .tl { position: relative; min-width: min-content; }
  .tl-head { position: sticky; top: 0; z-index: 4; display: flex; background: var(--background); border-bottom: 1px solid var(--border); height: 52px; }
  .tl-left { width: 300px; flex: none; position: sticky; left: 0; z-index: 3; background: var(--background); border-right: 1px solid var(--border); }
  .tl-days { display: flex; flex: none; }
  .wk { flex: none; border-left: 1px solid var(--border); }
  .wk b { display: block; font-weight: 500; font-size: 12px; padding: 7px 10px 0; }
  .wk .dd { display: flex; padding: 5px 0 0; }
  .wk .dd span { flex: 1; text-align: center; font-size: 10px; color: var(--muted-light); }
  .wk .dd span.today { color: var(--foreground); font-weight: 600; }
  .tl-row { display: flex; height: 40px; border-bottom: 1px solid color-mix(in srgb, var(--border) 55%, transparent); }
  .tl-row .tl-left { display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 13px; }
  .tl-row .tl-left .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .tl-row.obj .tl-left { font-weight: 500; background: var(--background); }
  .tl-row.kid .tl-left { padding-left: 38px; }
  .tl-row:hover .tl-left { background: var(--surface-muted); }
  .tl-grid { position: relative; flex: none; background-image: linear-gradient(to right, color-mix(in srgb, var(--border) 45%, transparent) 1px, transparent 1px); }
  .bar { position: absolute; top: 9px; height: 22px; border-radius: 6px; background: var(--surface-elevated); border: 1px solid var(--border); display: flex; align-items: center; gap: 6px; padding: 0 8px; font-size: 11.5px; color: var(--foreground); cursor: pointer; overflow: hidden; white-space: nowrap; transition: border-color .15s; }
  .bar:hover { border-color: var(--muted-light); }
  .bar .fill { position: absolute; inset: 0; opacity: .16; background: var(--bc); }
  .bar .fill.p { right: auto; opacity: .28; }
  .bar span { position: relative; }
  .bar.objbar { top: 15px; height: 10px; border-radius: 3px; border: 0; background: var(--foreground); opacity: .78; padding: 0; }
  .bar.objbar::before, .bar.objbar::after { content: ""; position: absolute; bottom: -5px; width: 2px; height: 7px; background: var(--foreground); }
  .bar.objbar::before { left: 0; } .bar.objbar::after { right: 0; }
  .today-line { position: absolute; top: 52px; bottom: 0; width: 0; border-left: 1.5px solid var(--danger); z-index: 2; pointer-events: none; opacity: .6; }
  .today-line::before { content: "Today"; position: absolute; top: -2px; left: -17px; font-size: 9.5px; background: var(--danger); color: #fff; padding: 1px 5px; border-radius: 4px; }
  svg.deps { position: absolute; left: 300px; top: 52px; pointer-events: none; z-index: 1; overflow: visible; }
  svg.deps path { fill: none; stroke: var(--muted-light); stroke-width: 1.25; }
  svg.deps polygon { fill: var(--muted-light); }

  /* ---------- peek panel: the brief ---------- */
  .scrim { position: absolute; inset: 0; background: transparent; z-index: 9; display: none; }
  .scrim.on { display: block; }
  .peek { position: absolute; top: 0; right: 0; bottom: 0; width: 560px; max-width: 100%; z-index: 10; background: var(--background); border-left: 1px solid var(--border); box-shadow: var(--shadow-pop); transform: translateX(104%); transition: transform .32s var(--ease); display: flex; flex-direction: column; }
  .peek.on { transform: none; }
  .peek-top { height: 64px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 20px 0 24px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 13px; }
  .icon-btn { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 7px; color: var(--muted); transition: background .15s, color .15s; }
  .icon-btn:hover { background: var(--surface-subtle); color: var(--foreground); }
  .peek-body { flex: 1; overflow-y: auto; padding: 24px 28px 40px; }
  .peek-title { font: 400 24px/1.25 var(--serif); letter-spacing: -0.015em; margin: 0 0 18px; outline: 0; }
  .props { display: grid; grid-template-columns: 92px 1fr; row-gap: 4px; align-items: center; font-size: 13px; margin-bottom: 22px; }
  .props .k { color: var(--muted); height: 30px; display: flex; align-items: center; gap: 8px; }
  .props .v { height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 8px; margin-left: -8px; border-radius: 6px; cursor: pointer; width: fit-content; transition: background .12s; }
  .props .v:hover { background: var(--surface-subtle); }

  .handoff { border: 1px solid var(--border); border-radius: 12px; background: var(--surface-elevated); padding: 16px; margin-bottom: 26px; }
  .handoff.review { border-color: color-mix(in srgb, var(--s-review) 45%, var(--border)); }
  .handoff.blocked { border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); }
  .handoff .hh { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 500; margin-bottom: 8px; }
  .handoff p { margin: 0 0 12px; color: var(--muted); font-size: 13.5px; line-height: 1.55; }
  .handoff p b { color: var(--foreground); font-weight: 500; }
  .handoff .acts { display: flex; gap: 8px; }
  .handoff .out { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .reply { display: flex; gap: 8px; }
  .reply input { flex: 1; height: 34px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--background); outline: 0; font-size: 13px; }
  .reply input:focus { border-color: var(--muted-light); }
  .meter { height: 4px; border-radius: 4px; background: var(--surface-subtle); overflow: hidden; margin: 2px 0 10px; }
  .meter i { display: block; height: 100%; background: var(--s-progress); border-radius: 4px; }
  .run-meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-bottom: 12px; }

  .sec { margin-bottom: 24px; }
  .sec h3 { margin: 0 0 8px; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-light); font-weight: 500; display: flex; align-items: center; gap: 8px; }
  .sec h3 em { font-style: normal; letter-spacing: 0; text-transform: none; font-weight: 400; margin-left: auto; }
  .sec p { margin: 0; font-size: 14.5px; line-height: 1.6; }
  .ctx { display: flex; flex-wrap: wrap; gap: 6px; }
  .ctx .tag { height: 26px; padding: 0 10px; font-size: 12.5px; border: 1px solid var(--border); background: var(--surface-elevated); color: var(--foreground); }
  .ctx .add { color: var(--muted); border-style: dashed; background: transparent; }
  .check { display: flex; align-items: flex-start; gap: 11px; padding: 5px 0; font-size: 14.5px; line-height: 1.45; cursor: pointer; }
  .check .box { width: 16px; height: 16px; margin-top: 2px; flex: none; border: 1.5px solid var(--muted-light); border-radius: 4px; display: grid; place-items: center; transition: all .15s; color: transparent; }
  .check.on .box { background: var(--foreground); border-color: var(--foreground); color: var(--background); }
  .check.on span { color: var(--muted); }
  .check svg.i { width: 11px; height: 11px; stroke-width: 3; }
  .bounds { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .bound { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--surface-elevated); }
  .bound small { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11.5px; margin-bottom: 3px; }
  .bound small svg.i { width: 12px; height: 12px; }
  .bound div { font-size: 13.5px; }

  .act { display: flex; flex-direction: column; gap: 14px; border-left: 1px solid var(--border); margin-left: 8px; padding-left: 18px; }
  .ev { position: relative; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .ev::before { content: ""; position: absolute; left: -22px; top: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--border); border: 1.5px solid var(--background); box-sizing: content-box; }
  .ev b { color: var(--foreground); font-weight: 500; }
  .ev time { color: var(--muted-light); margin-left: 6px; font-size: 12px; }
  .cmt { display: flex; gap: 10px; margin-top: 18px; align-items: center; }
  .cmt input { flex: 1; height: 38px; padding: 0 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-elevated); outline: 0; font-size: 13.5px; }
  .cmt input:focus { border-color: var(--muted-light); }

  /* ---------- popover ---------- */

const items = () => DATA[S.scope]
const byId = id => items().find(t => t.id === id)
const needsMe = t => (t.st === 'review' && (t.rev === 'you' || S.scope === 'personal')) || (t.blocked && t.rev === 'you')
const visible = () => items().filter(t => {
  if (S.q && !(t.title + ' ' + t.id).toLowerCase().includes(S.q.toLowerCase())) return false
  if (S.filter === 'me') return needsMe(t)
  if (S.filter === 'agents') return who(t.a)?.agent
  if (S.filter === 'mine') return t.a === 'you' || t.rev === 'you'
  return true
})
const $ = s => document.querySelector(s)

/* ============================== chrome ============================== */
const RAIL = [['work', 'Work', 'work'], ['agents', 'Agents', 'bot'], ['chats', 'Chats', 'chat'], ['files', 'Files', 'file'], ['ext', 'Extensions', 'puzzle'], ['auto', 'Automations', 'flow']]
$('#railNav').innerHTML = RAIL.map(([id, l, i]) => `<button class="rail-btn ${id === 'work' ? 'on' : ''}" title="${l}">${ic(i)}<span>${l}</span></button>`).join('')

const VIEWS = [['list', 'List', 'list'], ['board', 'Board', 'board'], ['timeline', 'Timeline', 'gantt']]
function renderSidebar() {
  const count = s => DATA[s].filter(t => t.st !== 'done').length
  const scopes = [['personal', 'Personal', 'user'], ['workspace', 'Workspace', 'users']]
  $('#scopeNav').innerHTML = scopes.map(([id, l, i]) => {
    const on = S.scope === id
    return `<button class="scope-btn ${on ? 'on' : ''}" data-scope="${id}">${ic(i)}<span>${l}</span><span class="ct">${count(id)}</span></button>` +
      (on ? `<div class="kids">${VIEWS.map(([v, vl, vi]) => `<button class="kid ${S.view === v ? 'on' : ''}" data-view="${v}">${ic(vi)}<span>${vl}</span></button>`).join('')}</div>` : '')
  }).join('')
  const n = DATA[S.scope].filter(needsMe).length
  const agents = DATA[S.scope].filter(t => who(t.a)?.agent && t.st !== 'done').length
  $('#savedViews').innerHTML = [
    ['me', 'inbox', 'Needs you', n], ['agents', 'bot', 'Agent work', agents], ['mine', 'user', 'Assigned to me', DATA[S.scope].filter(t => t.a === 'you').length],
  ].map(([f, i, l, c]) => `<button class="mini" data-filter="${f}">${ic(i)}<span>${l}</span><span class="n">${c}</span></button>`).join('')
}
$('#scopeNav').onclick = e => {
  const sc = e.target.closest('[data-scope]'), v = e.target.closest('[data-view]')
  if (sc) { S.scope = sc.dataset.scope; S.filter = 'all'; closePeek() }
  if (v) S.view = v.dataset.view
  if (sc || v) { save(); render() }
}
$('#savedViews').onclick = e => { const b = e.target.closest('[data-filter]'); if (b) { S.filter = b.dataset.filter; S.view = S.view === 'timeline' ? 'list' : S.view; render() } }

function renderTop() {
  const sc = S.scope === 'workspace' ? 'Workspace' : 'Personal'
  const vl = VIEWS.find(v => v[0] === S.view)[1]
  $('#pageTitle').innerHTML = `${sc} <span>/</span> ${vl}`
  const all = items()
  const nMe = all.filter(needsMe).length
  const nAg = all.filter(t => who(t.a)?.agent && t.st !== 'done').length
  const F = [['all', 'Everything', null], ['me', 'Needs you', nMe], ['agents', 'Agent work', nAg], ['mine', 'Assigned to me', null]]
  $('#filters').innerHTML = F.map(([id, l, c]) =>
    `<button class="chip ${S.filter === id ? 'on' : ''}" data-f="${id}">${id === 'me' && c ? '<i class="dot"></i>' : ''}${l}${c ? ` <span style="opacity:.6">${c}</span>` : ''}</button>`).join('')
}
$('#filters').onclick = e => { const b = e.target.closest('[data-f]'); if (b) { S.filter = b.dataset.f; render() } }
$('#q').oninput = e => { S.q = e.target.value; renderView() }

/* ============================== views ============================== */
const dueTxt = t => { const d = t.st === 'done' ? '' : fmt(t.e); return `<span class="due ${t.st !== 'done' && t.e - 0 <= 3 ? 'soon' : ''}">${d}</span>` }
const flag = t => t.blocked ? `<span class="tag block">${ic('hand')}Needs input</span>` : (t.st === 'review' && who(t.a)?.agent ? `<span class="tag attn">${ic('check')}Ready for review</span>` : '')

function renderList() {
  const v = visible()
  let h = `<label class="quick">${ic('plus')}<input id="quick" placeholder="Add a task and press Enter" /></label>`
  for (const st of ORDER) {
    const g = v.filter(t => t.st === st)
    if (!g.length) continue
    h += `<section class="group ${S.closed[st] ? 'closed' : ''}" data-g="${st}">
      <div class="group-h">${ic('chevD', 'class="i chev"')}${stIcon(st)}<span>${STATUS[st].label}</span><span class="n">${g.length}</span></div>
      <div class="rows">${g.map(t => `<div class="row ${t.st === 'done' ? 'done' : ''} ${S.sel === t.id ? 'sel' : ''}" data-id="${t.id}">
        ${stIcon(t.st)}
        <span class="title">${t.title}</span>
        <span class="meta">${flag(t)}${t.obj ? `<span class="parent">${OBJ[t.obj].title}</span>` : ''}${dueTxt(t)}${avatar(t.a)}</span>
      </div>`).join('')}</div></section>`
  }
  if (!v.length) h += `<div class="empty" style="margin:24px">Nothing here.</div>`
  $('#view').innerHTML = h
  $('#quick').onkeydown = e => {
    if (e.key !== 'Enter' || !e.target.value.trim()) return
    const n = items().length + 100
    items().unshift({ id: (S.scope === 'workspace' ? 'OVL-' : 'ME-') + n, title: e.target.value.trim(), st: 'todo', pri: 1, a: S.scope === 'personal' ? 'you' : null, rev: 'you', obj: null, s: 0, e: 5,
      objective: '', ctx: [], done: [], doneOn: [], log: [['You', 'created this task', 'now']] })
    toast('Task added to Todo')
    render()
    $('#quick').focus()
  }
}

function renderBoard() {
  const v = visible()
  $('#view').innerHTML = `<div class="board">${BOARD.map(st => {
    const g = v.filter(t => t.st === st)
    return `<div class="col" data-col="${st}"><div class="col-h">${stIcon(st)}<span>${STATUS[st].label}</span><span class="n">${g.length}</span></div>
      <div class="col-b">${g.map(t => `<div class="card" draggable="true" data-id="${t.id}">
        <div class="t">${t.title}</div>
        ${flag(t) ? `<div>${flag(t)}</div>` : ''}
        <div class="foot"><span class="sp"></span>${t.st !== 'done' ? `<span>${fmt(t.e)}</span>` : ''}${avatar(t.a)}</div>
      </div>`).join('') || `<div class="empty">Drop a task here</div>`}</div></div>`
  }).join('')}</div>`
  let drag = null
  const view = $('#view')
  view.ondragstart = e => { const c = e.target.closest('.card'); if (!c) return; drag = c.dataset.id; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move' }
  view.ondragend = e => { e.target.closest?.('.card')?.classList.remove('dragging'); view.querySelectorAll('.col.over').forEach(c => c.classList.remove('over')) }
  view.ondragover = e => { const c = e.target.closest('.col'); if (!c) return; e.preventDefault(); view.querySelectorAll('.col.over').forEach(x => x !== c && x.classList.remove('over')); c.classList.add('over') }
  view.ondrop = e => {
    const c = e.target.closest('.col'); if (!c || !drag) return
    e.preventDefault(); move(drag, c.dataset.col); drag = null
  }
}

function move(id, st) {
  const t = byId(id); if (!t || t.st === st) return
  t.st = st; if (st !== 'progress') t.blocked = false
  t.log.unshift(['You', `moved this to ${STATUS[st].label}`, 'now'])
  toast(`${t.id} moved to ${STATUS[st].label}`)
  render()
}

/* ---- timeline ---- */
const DAY = 24, FROM = -7, DAYS = 49, LEFT = 300
function renderTimeline() {
  const v = visible()
  const groups = []
  const seen = new Set()
  for (const t of v) { const k = t.obj || '_'; if (!seen.has(k)) { seen.add(k); groups.push(k) } }
  const rows = []
  for (const k of groups) {
    const kids = v.filter(t => (t.obj || '_') === k).sort((a, b) => a.s - b.s)
    if (k !== '_') rows.push({ obj: OBJ[k], kids })
    kids.forEach(t => rows.push({ t, kid: k !== '_' }))
  }
  const width = DAYS * DAY
  const weeks = []
  for (let d = FROM; d < FROM + DAYS; d += 7) weeks.push(d)
  const x = off => (off - FROM) * DAY
  const pos = {}
  let h = `<div class="tl" style="width:${LEFT + width}px">
    <div class="tl-head"><div class="tl-left"></div><div class="tl-days">${weeks.map(w => {
      const wd = dt(w)
      return `<div class="wk" style="width:${7 * DAY}px"><b>${wd.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</b>
      <div class="dd">${[0, 1, 2, 3, 4, 5, 6].map(i => `<span class="${w + i === 0 ? 'today' : ''}">${'SMTWTFS'[dt(w + i).getDay()]}</span>`).join('')}</div></div>`
    }).join('')}</div></div>`
  rows.forEach((r, i) => {
    if (r.obj) {
      h += `<div class="tl-row obj"><div class="tl-left">${ic('chevD', 'style="color:var(--muted-light);width:13px"')}<span class="nm">${r.obj.title}</span></div>
        <div class="tl-grid" style="width:${width}px;background-size:${DAY * 7}px 100%"><div class="bar objbar" style="left:${x(Math.min(...r.kids.map(k => k.s)))}px;width:${(Math.max(...r.kids.map(k => k.e)) - Math.min(...r.kids.map(k => k.s))) * DAY}px"></div></div></div>`
    } else {
      const t = r.t; pos[t.id] = { i, l: x(t.s), r: x(t.e), y: i * 40 + 20 }
      const prog = { done: 1, review: 1, progress: t.prog ?? 0.5, todo: 0, backlog: 0 }[t.st]
      h += `<div class="tl-row ${r.kid ? 'kid' : ''}"><div class="tl-left">${stIcon(t.st)}<span class="nm" data-id="${t.id}">${t.title}</span>${avatar(t.a)}</div>
        <div class="tl-grid" style="width:${width}px;background-size:${DAY * 7}px 100%"><div class="bar" data-id="${t.id}" style="left:${x(t.s)}px;width:${Math.max(40, (t.e - t.s) * DAY)}px;--bc:${STATUS[t.st].c}">
          <div class="fill"></div><div class="fill p" style="width:${prog * 100}%"></div></div></div></div>`
    }
  })
  /* dependencies: finish-to-start arrows */
  const DEPS = [['OVL-143', 'OVL-152'], ['OVL-146', 'OVL-152'], ['OVL-148', 'OVL-150']]
  let svg = ''
  for (const [a, b] of DEPS) {
    const A = pos[a], B = pos[b]; if (!A || !B) continue
    const x1 = A.r, y1 = A.y, x2 = B.l, y2 = B.y
    const mid = Math.max(x1 + 10, Math.min(x2 - 10, (x1 + x2) / 2))
    svg += `<path d="M${x1} ${y1} H${x1 + 8} V${y2} H${x2 - 6}"/><polygon points="${x2},${y2} ${x2 - 6},${y2 - 3.5} ${x2 - 6},${y2 + 3.5}"/>`
  }
  h += `<svg class="deps" width="${width}" height="${rows.length * 40}">${svg}</svg>`
  h += `<div class="today-line" style="left:${LEFT + x(0) + DAY / 2}px"></div></div>`
  $('#view').innerHTML = h
  const vw = $('#view'); vw.scrollLeft = Math.max(0, x(0) - 120)
}

function renderView() {
  if (S.view === 'list') renderList(); else if (S.view === 'board') renderBoard(); else renderTimeline()
}
$('#view').onclick = e => {
  const g = e.target.closest('.group-h')
  if (g) { const k = g.parentElement.dataset.g; S.closed[k] = !S.closed[k]; g.parentElement.classList.toggle('closed'); return }
  const t = e.target.closest('[data-id]')
  if (t) openPeek(t.dataset.id)
}

/* ============================== peek: the brief ============================== */
const ctxIcon = { note: 'note', file: 'file', msg: 'msg', link: 'link' }
function openPeek(id) { S.sel = id; renderPeek(); $('#peek').classList.add('on'); $('#scrim').classList.add('on'); if (S.view === 'list') document.querySelectorAll('.row').forEach(r => r.classList.toggle('sel', r.dataset.id === id)) }
function closePeek() { S.sel = null; $('#peek').classList.remove('on'); $('#scrim').classList.remove('on'); document.querySelectorAll('.row.sel').forEach(r => r.classList.remove('sel')) }
$('#scrim').onclick = closePeek

function handoffHTML(t) {
  const w = who(t.a), name = w?.name || ''
  const h = t.handoff
  if (!h) return ''
  if (h.kind === 'review') return `<div class="handoff review"><div class="hh">${avatar(t.a)}<span>${name} submitted this for review</span></div>
    <p>${h.text}</p><div class="out">${h.out.map(([i, l]) => `<span class="tag" style="height:26px;font-size:12.5px;padding:0 10px;color:var(--foreground);border:1px solid var(--border);background:var(--background)">${ic(ctxIcon[i])}${l}</span>`).join('')}</div>
    <div class="acts"><button class="btn primary sm" data-act="approve">${ic('check')}Approve</button><button class="btn ghost sm" data-act="changes">Request changes</button></div></div>`
  if (h.kind === 'blocked') return `<div class="handoff blocked"><div class="hh">${avatar(t.a)}<span>${name} needs your input</span></div>
    <p>${h.text}</p><div class="reply"><input id="replyIn" placeholder="Reply to ${name.split(' ')[0]}" /><button class="btn primary sm" data-act="reply">Send</button></div></div>`
  if (h.kind === 'running') return `<div class="handoff"><div class="hh">${avatar(t.a)}<span>${name} is working</span></div>
    <div class="run-meta"><span>${h.step}</span><span>$${h.spent.toFixed(2)} of $${h.cap.toFixed(2)}</span></div><div class="meter"><i style="width:${h.spent / h.cap * 100}%"></i></div>
    <div class="acts"><button class="btn ghost sm" data-act="stop">${ic('stop', 'style="width:12px;height:12px"')}Stop</button></div></div>`
  if (h.kind === 'ready') return `<div class="handoff"><div class="hh">${ic('sparkle')}<span>Brief is complete</span></div>
    <p>${name} has everything it needs. Start it when you are ready; you will only be pulled back in for review or a question.</p>
    <div class="acts"><button class="btn primary sm" data-act="start">Start ${name.split(' ')[0]}</button></div></div>`
  return ''
}

function renderPeek() {
  const t = byId(S.sel); if (!t) return
  const empty = !t.objective
  const hasBounds = t.tools || t.budget
  $('#peek').innerHTML = `
    <div class="peek-top"><span>${t.obj ? OBJ[t.obj].title : 'Task'}</span><span class="grow"></span>
      <button class="icon-btn" title="More">${ic('more')}</button><button class="icon-btn" id="peekClose" title="Close · Esc">${ic('x')}</button></div>
    <div class="peek-body">
      <h2 class="peek-title" contenteditable="true" spellcheck="false">${t.title}</h2>
      <div class="props">
        <div class="k">${ic('sparkle', 'style="width:13px"')}Status</div><div class="v" data-pick="status">${stIcon(t.st)}${STATUS[t.st].label}${t.blocked ? ' <span class="tag block" style="margin-left:4px">Needs input</span>' : ''}</div>
        <div class="k">${ic('user', 'style="width:13px"')}Owner</div><div class="v" data-pick="owner">${avatar(t.a, true)}${who(t.a) ? who(t.a).name : '<span style="color:var(--muted-light)">Assign a person or agent</span>'}</div>
        <div class="k">${ic('check', 'style="width:13px"')}Reviewer</div><div class="v" data-pick="rev">${avatar(t.rev, true)}${who(t.rev)?.name || '<span style="color:var(--muted-light)">None</span>'}</div>
        <div class="k">${ic('flag', 'style="width:13px"')}Priority</div><div class="v"><span class="pri" data-p="${t.pri}"><i></i><i></i><i></i></span>${['', 'Low', 'Medium', 'High'][t.pri]}</div>
        <div class="k">${ic('cal', 'style="width:13px"')}Dates</div><div class="v">${fmt(t.s)} <span style="color:var(--muted-light)">to</span> ${fmt(t.e)}</div>
      </div>
      ${handoffHTML(t)}
      <div class="sec"><h3>Objective<em style="color:var(--muted-light)">The outcome, not the steps</em></h3>
        ${empty ? `<p style="color:var(--muted-light)">Describe what a good result looks like. An agent can start once the brief is filled in.</p>` : `<p>${t.objective}</p>`}</div>
      <div class="sec"><h3>Context</h3><div class="ctx">${t.ctx.map(([i, l]) => `<span class="tag">${ic(ctxIcon[i])}${l}</span>`).join('')}<span class="tag add">${ic('plus')}Add file, note or chat</span></div></div>
      <div class="sec"><h3>Done when<em>${t.done.length ? `${t.doneOn.filter(Boolean).length} of ${t.done.length}` : ''}</em></h3>
        ${t.done.map((d, i) => `<div class="check ${t.doneOn[i] ? 'on' : ''}" data-chk="${i}"><div class="box">${ic('check')}</div><span>${d}</span></div>`).join('')}
        <div class="check" style="color:var(--muted-light)"><div class="box" style="border-style:dashed">${''}</div><span>Add a condition</span></div></div>
      ${hasBounds ? `<div class="sec"><h3>Boundaries</h3><div class="bounds">
        <div class="bound"><small>${ic('wrench')}Tools</small><div>${t.tools}</div></div>
        <div class="bound"><small>${ic('dollar')}Budget cap</small><div>${t.budget}</div></div>
        <div class="bound" style="grid-column:1/-1"><small>${ic('hand')}Ask me first</small><div>${t.approve}</div></div></div></div>` : ''}
      <div class="sec"><h3>Activity</h3><div class="act">${t.log.map(([n, a, ago]) => `<div class="ev"><b>${n}</b> ${a}<time>${ago}</time></div>`).join('')}</div>
        <div class="cmt">${avatar('you', true)}<input placeholder="Leave a comment" /></div></div>
    </div>`
  $('#peekClose').onclick = closePeek
}

$('#peek').onclick = e => {
  const t = byId(S.sel); if (!t) return
  const chk = e.target.closest('[data-chk]')
  if (chk) { const i = +chk.dataset.chk; t.doneOn[i] = t.doneOn[i] ? 0 : 1; renderPeek(); return }
  const act = e.target.closest('[data-act]')?.dataset.act
  if (act === 'approve') { t.st = 'done'; t.log.unshift(['You', 'approved', 'now']); t.handoff = null; toast(`${t.id} approved and marked done`); render(); renderPeek() }
  if (act === 'changes') { t.st = 'progress'; t.log.unshift(['You', 'asked for changes', 'now']); t.handoff = { kind: 'running', step: 'Step 1 of 4 · reading your feedback', spent: 0.2, cap: 5 }; toast('Sent back to ' + who(t.a).name); render(); renderPeek() }
  if (act === 'reply') { t.blocked = false; t.log.unshift(['You', 'replied to ' + who(t.a).name, 'now']); t.handoff = { kind: 'running', step: 'Step 4 of 5 · continuing with your answer', spent: 1.1, cap: 2 }; toast('Reply sent'); render(); renderPeek() }
  if (act === 'start') { t.st = 'progress'; t.log.unshift([who(t.a).name, 'started working', 'now']); t.handoff = { kind: 'running', step: 'Step 1 of 4 · reading the brief', spent: 0.05, cap: 3 }; toast(who(t.a).name + ' started'); render(); renderPeek() }
  if (act === 'stop') { t.st = 'todo'; t.handoff = null; t.log.unshift(['You', 'stopped the run', 'now']); toast('Run stopped'); render(); renderPeek() }
  const pick = e.target.closest('[data-pick]')
  if (pick) showPicker(pick, pick.dataset.pick, t)
}

/* ---- popovers ---- */
let pop = null
function closePop() { pop?.remove(); pop = null }
function showPicker(anchor, kind, t) {
  closePop()
  const r = anchor.getBoundingClientRect()
  let body = ''
  if (kind === 'status') body = `<div class="lbl">Status</div>` + BOARD.map(s => `<div class="opt" data-v="${s}">${stIcon(s)}${STATUS[s].label}</div>`).join('')
  else {
    body = `<div class="lbl">People</div>` + Object.keys(PEOPLE).map(p => `<div class="opt" data-v="${p}">${avatar(p)}${PEOPLE[p].name}</div>`).join('')
    if (kind === 'owner') body += `<div class="lbl">Agents</div>` + Object.keys(AGENTS).map(p => `<div class="opt" data-v="${p}">${avatar(p)}${AGENTS[p].name}</div>`).join('') + `<div class="opt" data-v="">${avatar(null)}Unassigned</div>`
  }
  pop = document.createElement('div'); pop.className = 'pop'; pop.innerHTML = body
  document.body.appendChild(pop)
  pop.style.left = Math.min(r.left, innerWidth - 250) + 'px'; pop.style.top = Math.min(r.bottom + 6, innerHeight - pop.offsetHeight - 12) + 'px'
  pop.onclick = e => {
    const o = e.target.closest('.opt'); if (!o) return
    const v = o.dataset.v || null
    if (kind === 'status') { t.st = v; if (v !== 'progress') t.blocked = false; t.log.unshift(['You', `moved this to ${STATUS[v].label}`, 'now']) }
    if (kind === 'owner') { t.a = v; t.log.unshift(['You', v ? `assigned this to ${who(v).name}` : 'unassigned this', 'now']) }
    if (kind === 'rev') t.rev = v
    closePop(); render(); renderPeek()
  }
}
document.addEventListener('mousedown', e => { if (pop && !pop.contains(e.target) && !e.target.closest('[data-pick]')) closePop() })

/* ============================== misc ============================== */
let tt
function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 2000) }
function focusNew() { S.view = 'list'; render(); $('#quick')?.focus() }
$('#newBtn').onclick = focusNew
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (pop) closePop(); else closePeek() }
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName) || document.activeElement.isContentEditable
  if (!typing && e.key.toLowerCase() === 'c' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); focusNew() }
})

function setTheme(t) {
  document.documentElement.dataset.theme = t
  try { localStorage.setItem('overlay-mockup-theme', t) } catch (e) {}
  $('#themeIcon').innerHTML = t === 'dark' ? P.sun : P.moon
  $('#themeLbl').textContent = t === 'dark' ? 'Light' : 'Dark'
}
$('#themeBtn').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark')
setTheme(document.documentElement.dataset.theme)

function render() { renderSidebar(); renderTop(); renderView(); if (S.sel && byId(S.sel)) { /* keep row highlight */ } }
render()
</script>
</body>
</html>
