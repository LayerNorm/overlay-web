:root {
  font-family: Geist,Arial,sans-serif;
  color-scheme: light;
  --foreground: #27272a;
  --background: #fafafa;
  --surface-elevated: #fff;
  --surface-subtle: #f0f0f0;
  --surface-muted: #f5f5f5;
  --border: #e4e4e7;
  --muted: #71717a;
  --muted-light: #a1a1aa;
  --primary: #dcdce1;
  --primary-foreground: #27272a;
  --button-primary-hover: #ccccd3;
  --button-secondary-border: transparent;
  --button-secondary-hover: #e4e4e7;
  --overlay-ease: cubic-bezier(.23,1,.32,1);
}
:root.dark {
  color-scheme: dark;
  --foreground: #f5f5f5;
  --background: #09090b;
  --surface-elevated: #111113;
  --surface-subtle: #1c1c20;
  --surface-muted: #151518;
  --border: #27272a;
  --muted: #a1a1aa;
  --muted-light: #71717a;
  --primary: #3b3b42;
  --primary-foreground: #ededf0;
  --button-primary-hover: #484850;
  --button-secondary-hover: #232328;
}
* {
  box-sizing: border-box;
}
html,body,#root {
  height: 100%;
  margin: 0;
}
body {
  background: var(--background);
  color: var(--foreground);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
}
button:focus-visible {
  outline: 2px solid var(--muted);
  outline-offset: 3px;
}
svg {
  flex-shrink: 0;
}
p,h1,h2 {
  margin: 0;
}
.brand-lockup {
  display: inline-flex;
  align-items: baseline;
  gap: .043em;
  font-family: 'Libre Baskerville',serif;
  font-weight: 400;
  letter-spacing: -.025em;
  line-height: 1;
  white-space: nowrap;
  font-size: 20px;
}
.brand-lockup-mark {
  display: inline-flex;
  flex: none;
  width: .86em;
  height: .86em;
  translate: 0 .045em;
}
.brand-lockup-mark>svg {
  width: 100%;
  height: 100%;
  display: block;
}
.brand-lockup-mask {
  display: inline-flex;
  overflow: hidden;
  padding: .2em 0;
  margin: -.2em 0;
}
.brand-lockup-word {
  display: inline-block;
}
.onboarding {
  height: 100dvh;
  display: flex;
  flex-direction: column;
}
.top {
  height: 56px;
  flex-shrink: 0;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.top>button {
  font-size: 13px;
  font-weight: 400;
}
.transcript-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.transcript {
  width: 100%;
  max-width: 720px;
  margin: auto;
  padding: 30px 20px 28px;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}
.assistant-message {
  display: grid;
  grid-template-columns: 28px minmax(0,1fr);
  gap: 12px;
  margin-top: 24px;
}
.assistant-message:first-child {
  margin-top: 0;
}
.assistant-message>.overlay-mark {
  margin-top: 1px;
}
.message-author {
  font-size: 13px;
  font-weight: 600;
  line-height: 28px;
}
.message-text {
  line-height: 1.65;
  overflow-wrap: anywhere;
}
.message-text p+p {
  margin-top: 8px;
}
.user-message {
  display: flex;
  justify-content: flex-end;
  margin-top: 24px;
}
.user-message>div {
  max-width: 80%;
  border-radius: 18px;
  padding: 8px 14px;
  background: var(--surface-subtle);
  overflow-wrap: anywhere;
}
.reply {
  margin-top: 14px;
}
.dock {
  padding: 0 20px 30px;
  flex-shrink: 0;
}
.composer {
  max-width: 720px;
  margin: auto;
  display: flex;
  align-items: flex-end;
  gap: 12px;
  padding: 12px 12px 12px 16px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--surface-elevated);
}
.composer [data-slot=textarea] {
  min-height: 26px;
  max-height: 120px;
  resize: none;
  padding: 2px 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  font-size: 14px;
  line-height: 22px;
  box-shadow: none;
}
.composer-placeholder {
  height: 12px;
}
.actions {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 16px;
  flex-wrap: wrap;
}
.hint {
  font-size: 12px;
  line-height: 1.6;
  color: var(--muted);
  margin-top: 10px;
}
.connections {
  display: grid;
  gap: 4px;
}
.connection {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  font-size: 13px;
}
.connection>span,.connection>div {
  flex: 1;
}
.connection>div p {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}
.connection>svg {
  color: var(--muted);
}
.section-label {
  font-size: 11px;
  color: var(--muted);
  margin-top: 24px;
}
.task-preview {
  background: var(--surface-subtle);
  border-radius: 12px;
  padding: 16px;
  overflow-wrap: anywhere;
}
.task-preview>span {
  font-size: 11px;
  color: var(--muted);
}
.task-preview>p {
  margin-top: 5px;
  font-weight: 500;
}
.task-preview>div {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--muted);
  margin-top: 12px;
}
.task-preview>div>span {
  margin-left: 8px;
}
.subscription-offer {
  padding: 18px 0 2px;
}
.offer-price {
  display: flex;
  align-items: baseline;
  gap: 7px;
  margin-bottom: 6px;
}
.offer-price b {
  font-size: 28px;
  font-weight: 500;
  letter-spacing: -.8px;
}
.offer-price span {
  font-size: 13px;
  color: var(--muted);
}
.subscription-offer>p {
  font-size: 13px;
}
.subscription-offer>.hint {
  font-size: 11px;
  max-width: 460px;
  margin-top: 7px;
}
.payment-note {
  font-size: 12px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 16px;
}
.preview-toggle {
  position: fixed;
  bottom: 5px;
  right: 12px;
  font-size: 10px;
  font-weight: 400;
  height: 20px;
  color: var(--muted-light);
}
.preview-note {
  font-size: 11px !important;
  font-weight: 400 !important;
  color: var(--muted);
  margin-top: 16px !important;
}
[data-slot=dialog-content] {
  border: 0;
}
[data-slot=dialog-description] {
  font-size: 13px;
  line-height: 1.65;
  color: var(--muted);
}
.checkout-summary {
  padding: 16px 0;
  display: flex;
  justify-content: space-between;
  font-size: 13px;
}
.checkout-summary strong {
  font-weight: 500;
}
@media (max-width:640px) {
  .top {
    height: 54px;
    padding: 0 16px;
  }
  .transcript {
    padding: 24px 16px;
  }
  .assistant-message {
    gap: 10px;
    grid-template-columns: 24px minmax(0,1fr);
  }
  .assistant-message>.overlay-mark {
    width: 24px;
    height: 24px;
  }
  .dock {
    padding: 0 16px 30px;
  }
  .message-text {
    font-size: 14px;
  }
  .connection {
    gap: 8px;
  }
  .connection>div p {
    max-width: 180px;
  }
  .user-message>div {
    max-width: 90%;
  }
  .composer {
    padding: 10px 10px 10px 14px;
  }
  .subscription-offer>.hint {
    font-size: 11px;
  }
}
