<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Subscription connection scope</title>
<style>
:root{color-scheme:light;--bg:#f7f7f7;--panel:#fff;--muted:#71717a;--text:#18181b;--soft:#f4f4f5;--hover:#ededee;--selected:#e9e9eb;--line:#e4e4e7}.dark{color-scheme:dark;--bg:#141414;--panel:#202020;--muted:#a1a1aa;--text:#ededed;--soft:#292929;--hover:#303030;--selected:#373737;--line:#383838}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;border-radius:7px}button:hover{background:var(--hover)}button:focus-visible{outline:2px solid #96969e;outline-offset:3px}svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}.demo{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;color:var(--muted);font-size:12px}.demo button{padding:8px 10px;font-size:12px}main{display:grid;place-items:center;padding:20px 16px 36px;min-height:calc(100dvh - 72px)}.dialog{width:min(480px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;box-shadow:0 22px 65px #0003;max-height:calc(100dvh - 105px);overflow-y:auto}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}h1{font-size:18px;font-weight:600;letter-spacing:-.4px;margin:0}header button{display:grid;place-items:center;width:26px;height:26px;color:var(--muted)}.tabs{display:flex;gap:4px;padding:4px;background:var(--soft);border-radius:8px}.tabs button{flex:1;font-size:13px;padding:7px 12px;color:var(--muted)}.tabs button[aria-pressed=true]{background:var(--selected);color:var(--text)}.label{font-size:12px;font-weight:500;margin:19px 0 8px}.help{font-size:12px;line-height:1.5;color:var(--muted);margin:8px 0 18px}.scope button{display:flex;justify-content:center;align-items:center;gap:7px}.providers{display:grid;gap:3px}.provider{display:flex;align-items:center;width:100%;padding:10px 12px;gap:12px;text-align:left;min-height:49px}.provider[aria-pressed=true]{background:var(--soft)}.logo{width:24px;height:24px;display:grid;place-items:center}.logo svg{width:21px;height:21px}.provider span:nth-child(2){flex:1;font-size:13px}.provider>.check{width:14px;height:14px;visibility:hidden}.provider[aria-pressed=true]>.check{visibility:visible}.privacy{font-size:11px;line-height:1.6;color:var(--muted);display:flex;gap:8px;margin:20px 0 0}.privacy svg{width:13px;height:13px;margin-top:3px}footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}footer button{font-size:13px;padding:8px 13px}footer .primary{background:var(--selected)}#result{margin:12px 0 0;font-size:12px;color:var(--muted);line-height:1.5}[hidden]{display:none!important}
</style>
</head>
<body>
<div class="demo"><span>Subscription scope · Design preview</span><button id="theme">Light mode</button></div>
<main><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="title">
<header><h1 id="title">Add provider</h1><button aria-label="Reset preview" id="reset"><svg viewBox="0 0 24 24"><path d="m18 6-12 12M6 6l12 12"/></svg></button></header>
<div class="tabs"><button aria-pressed="true">Subscription</button><button id="api">API key</button></div>
<p class="label">Available to</p>
<div class="tabs scope" aria-label="Connection scope"><button id="personal" aria-pressed="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg>Personal</button><button id="workspace" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/><circle cx="9" cy="7" r="4"/></svg>Workspace</button></div>
<p class="help" id="scope-help">Only you can use this connection.</p>
<div class="providers" id="providers" aria-label="Subscription providers"></div>
<p class="privacy"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span>Provider limits apply. Overlay will not switch to paid inference if this connection becomes unavailable.</span></p>
<p id="result" role="status" hidden></p>
<footer><button id="cancel">Cancel</button><button class="primary" id="continue">Continue</button></footer>
</section></main>
<script>
const icons={check:'<svg viewBox="0 0 24 24" class="check"><path d="m5 12 4 4L19 6"/></svg>',openai:'<svg viewBox="0 0 24 24"><path d="M12 3a5 5 0 0 1 8 5 5 5 0 0 1 0 8 5 5 0 0 1-8 5 5 5 0 0 1-8-5 5 5 0 0 1 0-8 5 5 0 0 1 8-5Z"/><path d="m12 7 4 2.5v5L12 17l-4-2.5v-5Z"/></svg>',claude:'<svg viewBox="0 0 24 24"><path d="m12 2 0 20M2 12h20M5 5l14 14M5 19 14-14M8 3l8 18M3 8l18 8M3 16l18-8M8 21 8-18"/></svg>',xai:'<svg viewBox="0 0 24 24"><path d="m5 20 14-16M4 6l5 6M15 14l5 6M10 20h10V10"/></svg>',meta:'<svg viewBox="0 0 24 24"><path d="M12 13C8 4 5 5 3 9c-3 7-1 10 2 10 5 0 9-14 13-13 4 1 6 13 2 13-3 0-5-4-8-9"/></svg>',kimi:'<svg viewBox="0 0 24 24"><path d="M5 3v18M19 3 5 14M10 10l10 11"/></svg>',devin:'<svg viewBox="0 0 24 24"><path d="M7 4h7a6 6 0 0 1 6 6v4a6 6 0 0 1-6 6H7l-4-8Z"/></svg>'};
const providers=[['openai','ChatGPT / Codex'],['claude','Claude'],['xai','Grok Build'],['meta','Meta Muse'],['kimi','Kimi'],['kimi','Kimi AI'],['devin','Devin']];
let scope='personal',selected=1;const $=id=>document.getElementById(id);
function render(){ $('personal').setAttribute('aria-pressed',scope==='personal');$('workspace').setAttribute('aria-pressed',scope==='workspace');$('scope-help').textContent=scope==='personal'?'Only you can use this connection.':'Members of the Acme workspace can use this connection.';$('providers').innerHTML=providers.map(([id,name],i)=>'<button class="provider" data-index="'+i+'" aria-pressed="'+(selected===i)+'"><span class="logo">'+icons[id]+'</span><span>'+name+'</span>'+icons.check+'</button>').join('');$('result').hidden=true;}
$('personal').onclick=()=>{scope='personal';render()};$('workspace').onclick=()=>{scope='workspace';render()};$('providers').onclick=e=>{const b=e.target.closest('[data-index]');if(b){selected=Number(b.dataset.index);render()}};$('theme').onclick=()=>{$('theme').textContent=document.documentElement.classList.toggle('dark')?'Light mode':'Dark mode'};$('reset').onclick=$('cancel').onclick=()=>{scope='personal';selected=1;render()};$('continue').onclick=()=>{$('result').hidden=false;$('result').textContent='Preview: continue to '+providers[selected][1]+' sign-in. Scope stays '+(scope==='personal'?'Personal.':'Acme workspace.')};$('api').onclick=()=>{$('result').hidden=false;$('result').textContent='API-key setup is unchanged by this preview.'};render();
</script>
</body></html>
