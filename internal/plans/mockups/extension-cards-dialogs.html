@layer base {
  *, ::after, ::before, ::backdrop, ::file-selector-button {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    border: 0 solid;
  }
  html, :host {
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    tab-size: 4;
    font-family: var(--default-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji");

  }
  hr {
    height: 0;
    color: inherit;
    border-top-width: 1px;
  }
  abbr:where([title]) {
    -webkit-text-decoration: underline dotted;
    text-decoration: underline dotted;
  }
  h1, h2, h3, h4, h5, h6 {
    font-size: inherit;
    font-weight: inherit;
  }
  a {
    color: inherit;
    -webkit-text-decoration: inherit;
    text-decoration: inherit;
  }
  b, strong {
    font-weight: bolder;
  }
  code, kbd, samp, pre {
    font-family: var(--default-mono-font-family, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace);
    font-feature-settings: var(--default-mono-font-feature-settings, normal);
    font-variation-settings: var(--default-mono-font-variation-settings, normal);
    font-size: 1em;
  }
  small {
    font-size: 80%;
  }
  sub, sup {
    font-size: 75%;
    line-height: 0;
    position: relative;
    vertical-align: baseline;
  }
  sub {
    bottom: -0.25em;
  }
  sup {
    top: -0.5em;
  }
  table {
    text-indent: 0;
    border-color: inherit;
    border-collapse: collapse;
  }
  :-moz-focusring:where(:not(iframe)) {
    outline: auto;
  }
  progress {
    vertical-align: baseline;
  }
  summary {
    display: list-item;
  }
  ol, ul, menu {
    list-style: none;
  }
  img, svg, video, canvas, audio, iframe, embed, object {
    display: block;
    vertical-align: middle;
  }
  img, video {
    max-width: 100%;
    height: auto;
  }
  button, input, select, optgroup, textarea, ::file-selector-button {
    font: inherit;
    font-feature-settings: inherit;

    letter-spacing: inherit;
    color: inherit;
    border-radius: 0;

    opacity: 1;

    margin-inline-end: 4px;
  }

    opacity: 1;

      }
    }
  }

:root {
  font-family: Geist,Arial,sans-serif;
  color-scheme: light;
  --foreground: #18181b;
  --background: #fff;
  --surface-elevated: #fff;
  --surface-subtle: #f4f4f5;
  --surface-muted: #eaeaec;
  --border: #e4e4e7;
  --muted: #71717a;
  --muted-light: #a1a1aa;
  --primary: #27272a;
  --primary-foreground: #fafafa;
  --button-primary-hover: #3f3f46;
  --button-secondary-border: #e4e4e7;
  --button-secondary-hover: #e4e4e7;
  --page: #fafafa;
  --error: #dc2626;
}
:root.dark {
  color-scheme: dark;
  --foreground: #fafafa;
  --background: #18181b;
  --surface-elevated: #18181b;
  --surface-subtle: #27272a;
  --surface-muted: #323235;
  --border: #353538;
  --muted: #a1a1aa;
  --muted-light: #71717a;
  --primary: #3f3f46;
  --primary-foreground: #fafafa;
  --button-primary-hover: #52525b;
  --button-secondary-border: #3f3f46;
  --button-secondary-hover: #323235;
  --page: #101012;
  --error: #f87171;
}
body {
  margin: 0;
  background: var(--page);
  color: var(--foreground);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}
button {
  cursor: pointer;
}
button:focus-visible {
  outline: 2px solid var(--muted);
  outline-offset: 3px;
}
button:disabled {
  cursor: not-allowed;
}
svg {
  flex-shrink: 0;
}
.preview-bar {
  height: 64px;
  padding: 0 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
  background: var(--page);
}
.preview-divider {
  margin: 0 12px;
  color: var(--muted-light);
}
main {
  max-width: 1120px;
  margin: 0 auto;
  padding: 56px 32px;
}
.page-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 32px;
}
h1 {
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -.8px;
  line-height: 1.3;
}
.page-heading p {
  color: var(--muted);
  margin-top: 8px;
}
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
}
[data-slot=tabs-list] {
  padding: 4px;
  width: fit-content;
}
[data-slot=tabs-trigger] {
  height: 32px;
  font-size: 13px;
  gap: 8px;
  padding: 0 14px;
}
.search {
  position: relative;
  width: 232px;
}
.search>svg {
  position: absolute;
  left: 12px;
  top: 11px;
  color: var(--muted);
}
.search input {
  padding-left: 36px;
}
.cards-grid {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 20px;
}
.extension-card {
  gap: 20px;
  padding-bottom: 0;
  overflow: hidden;
  box-shadow: none;
  transition: border-color .15s;
}
.extension-card:hover {
  border-color: var(--muted-light);
}
.card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.extension-icon {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 9px;
  background: var(--surface-subtle);
  color: var(--foreground);
}
.status-badge {
  font-size: 11px;
  font-weight: 400;
  gap: 6px;
  padding: 3px 8px;
  border-radius: 6px;
}
.status-dot {
  height: 5px;
  width: 5px;
  background: var(--muted-light);
  border-radius: 50%;
}
.status-dot.connected {
  background: #16a34a;
}
.status-dot.active {
  background: var(--foreground);
}
.error {
  color: var(--error);
}
.error .status-dot {
  background: var(--error);
}
.card-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--muted);
  margin-top: auto;
}
.meta-dot {
  padding: 0 2px;
}
.card-footer {
  padding: 0 16px 16px 24px;
  justify-content: space-between;
}
.footer-detail {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-right: 8px;
}
.card-footer button {
  color: var(--foreground);
  padding: 0 8px;
  font-size: 12px;
}
.preview-note {
  color: var(--muted);
  font-size: 12px;
  margin-top: 24px;
}
.empty {
  grid-column: 1/-1;
  text-align: center;
  padding: 56px;
  color: var(--muted);
}
.editor-dialog {
  width: min(560px,calc(100vw - 32px));
  padding: 0;
  gap: 0;
  overflow: hidden;
  max-height: calc(100dvh - 32px);
}
.editor-form {
  display: flex;
  flex-direction: column;
  max-height: calc(100dvh - 32px);
  min-height: 0;
}
.editor-header {
  padding: 24px 48px 20px 24px;
  flex-shrink: 0;
}
.dialog-heading {
  display: flex;
  align-items: center;
  gap: 12px;
}
.editor-body {
  overflow-y: auto;
  min-height: 0;
  padding: 0 24px 24px;
}
.fields {
  display: grid;
  gap: 20px;
}
.field {
  display: grid;
  gap: 8px;
}
.field-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
[data-slot=select-trigger] {
  background: var(--surface-elevated);
  border-radius: 6px;
}
[data-slot=select-trigger] svg {
  width: 14px;
  height: 14px;
}
.connection-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 8px 0;
}
.connection-row>div {
  display: flex;
  gap: 10px;
  align-items: center;
}
.connection-row strong {
  font-size: 13px;
  font-weight: 500;
}
.connection-row p {
  font-size: 12px;
  color: var(--muted);
  margin-top: 3px;
  line-height: 1.5;
}
.connection-row>div>svg {
  color: var(--muted);
}
.active-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-top: 24px;
}
.active-row p {
  font-size: 12px;
  color: var(--muted);
  margin-top: 8px;
}
.editor-footer {
  margin: 0;
  justify-content: space-between;
  padding: 0 24px 24px;
  gap: 8px;
  flex-shrink: 0;
  background: var(--surface-elevated);
}
.footer-actions {
  display: flex;
  gap: 8px;
}
.delete-button {
  color: var(--muted);
  padding: 0 8px;
  margin-left: -8px;
}
.delete-button:hover {
  color: var(--error);
  background: var(--error);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in srgb,var(--error) 7%,transparent);
  }
}
.instructions {
  min-height: 200px;
  border-radius: 6px;
  line-height: 1.7;
  font-size: 13px;
  resize: vertical;
}
.field-help {
  font-size: 12px;
  color: var(--muted);
}
.tools-empty {
  text-align: center;
  padding: 32px 20px;
  color: var(--muted);
}
.tools-empty>svg {
  margin: 0 auto 16px;
}
.tools-empty h3 {
  color: var(--foreground);
  font-weight: 500;
  margin-bottom: 8px;
}
.tools-empty p {
  line-height: 1.6;
}
.tools-empty span {
  display: block;
  font-size: 12px;
  margin-top: 20px;
}
.delete-dialog {
  width: min(440px,calc(100vw - 32px));
  padding: 24px;
}
[data-slot=alert-dialog-action] {
  background: #dc2626;
  color: #fff;
}
[data-slot=alert-dialog-action]:hover {
  background: #b91c1c;
}
[data-slot=switch] {
  height: 20px;
  width: 36px;
  border: 1px solid transparent;
  box-shadow: 0 1px 2px #0000000d;
}
[data-slot=switch][data-state=checked] {
  background: var(--foreground);
  border-color: var(--foreground);
}
[data-slot=switch][data-state=unchecked] {
  background: var(--border);
  border-color: var(--border);
}
[data-slot=switch-thumb] {
  height: 16px;
  width: 16px;
  background: var(--surface-elevated);
}
[data-slot=switch-thumb][data-state=checked] {
  translate: 16px 0;
}
[data-slot=switch-thumb][data-state=unchecked] {
  translate: 2px 0;
}
@media (min-width:821px) {
  .extension-card [data-slot=card-description] {
    min-height: 48px;
  }
}
@media (max-width:820px) {
  main {
    padding: 32px 24px;
  }
  .cards-grid {
    grid-template-columns: repeat(2,minmax(0,1fr));
  }
}
@media (max-width:560px) {
  .preview-bar {
    padding: 0 16px;
    height: 52px;
  }
  main {
    padding: 28px 16px;
  }
  .page-heading {
    gap: 12px;
    align-items: flex-start;
  }
  .page-heading h1 {
    font-size: 24px;
  }
  .page-heading p {
    max-width: 180px;
    line-height: 1.5;
  }
  .page-heading button {
    padding: 0 12px;
  }
  .toolbar {
    flex-wrap: wrap;
  }
  .search {
    width: 100%;
  }
  .cards-grid {
    grid-template-columns: 1fr;
  }
  .editor-header {
    padding: 20px 44px 20px 20px;
  }
  .editor-body {
    padding: 0 20px 20px;
  }
  .editor-footer {
    padding: 0 20px 20px;
  }
  .footer-actions {
    gap: 6px;
  }
  .footer-actions button {
    padding: 0 12px;
  }
  .editor-footer button {
    font-size: 12px;
  }
  .dialog-heading .extension-icon {
    display: none;
  }
  .field-pair {
    gap: 12px;
  }
  .connection-row {
    padding: 8px 0;
    gap: 8px;
  }
  .connection-row>div>svg {
    display: none;
  }
}
